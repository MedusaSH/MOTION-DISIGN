        var a = ENV[Math.min(i, ENV.length - 1)], b = ENV[Math.min(i + 1, ENV.length - 1)]; return a + (b - a) * f; }

      var N = 90, PITCH = 20, BH = 280, C = (N - 1) / 2;
      var wave = $("f07-wave"), bars = [];
      for (var i = 0; i < N; i++) {
        var b = document.createElement("div"); b.className = "f07-bar"; b.id = "f07-bar" + i;
        b.style.left = (960 + (i - C) * PITCH - 5) + "px"; wave.appendChild(b); bars.push(b);
      }
      function bell(i) { var d = Math.abs(i - C) / (C + 1); return Math.cos(d * Math.PI / 2); }
      function idleH(i) { return 26 + 120 * bell(i) * (0.45 + 0.55 * FX.rnd(i + 7)); }

      /* the wave sits a little lower than the handoff centre once the headline arrives */
      tl.fromTo(wave, { y: 0 }, { y: 70, duration: 0.9, ease: "power3.inOut", immediateRender: false }, 0.12);
      tl.fromTo($("f07-hbar"), { y: 0 }, { y: 70, duration: 0.9, ease: "power3.inOut", immediateRender: false }, 0.12);

      /* 0.00 the bar multiplies, from the centre out, 0.012 s apart */
      bars.forEach(function (b, i) {
        var rank = Math.floor(Math.abs(i - C));
        var x0 = 960 - (960 + (i - C) * PITCH);
        tl.fromTo(b, { x: x0, scaleY: 160 / BH, opacity: 1 },
          { x: 0, scaleY: idleH(i) / BH, duration: 0.24, ease: "expo.out", immediateRender: false }, rank * 0.012);
      });
      tl.fromTo($("f07-hbar"), { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "none", immediateRender: false }, 0.05);

      /* 0.40 → 1.86 the wave follows the real amplitude, rippling out from the centre */
      var STEP = 1 / 15;
      bars.forEach(function (b, i) {
        var lag = Math.abs(i - C) * 0.006;
        for (var k = 0; k * STEP + 0.40 < 1.86; k++) {
          var t = 0.40 + k * STEP;
          var e = env(t - lag);
          var peak = 0.85 * Math.exp(-Math.pow((t - 1.16) / 0.12, 2)); /* 1.12 « parlez. » : peak */
          var amp = Math.min(1, 0.16 + e * 0.85 + peak) * Math.pow(bell(i), 0.55) * (0.5 + 0.5 * FX.rnd(i * 31 + k * 7));
          var h = 16 + (226 - 16) * amp;
          tl.to(b, { scaleY: h / BH, duration: STEP, ease: "sine.inOut" }, t);
        }
      });

      /* ember glow behind the wave, breathing up to the peak */
      tl.fromTo($("f07-glow1"), { opacity: 0, scale: 0.6 }, { opacity: 0.55, scale: 0.9, duration: 0.5, ease: "power2.out", immediateRender: false }, 0.05);
      tl.to($("f07-glow1"), { opacity: 0.9, scale: 1.05, duration: 0.14, ease: "expo.out" }, 1.12);
      tl.to($("f07-glow1"), { opacity: 0.6, scale: 1.0, duration: 0.6, ease: "power2.out" }, 1.26);

      /* camera : pull −2 %/s */
      tl.fromTo($("f07-cam1"), { scale: 1 }, { scale: 1 - 0.02 * 1.86, duration: 1.86, ease: "none", immediateRender: false }, 0);

      /* 0.80 « ● Enregistrement… » lands above */
      tl.fromTo($("f07-pill"), { opacity: 0, y: -24, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "back.out(2.2)", immediateRender: false }, 0.80);
      tl.fromTo($("f07-dot"), { opacity: 1 }, { opacity: 0.25, duration: 0.25, ease: "sine.inOut", immediateRender: false }, 1.15);
      tl.to($("f07-dot"), { opacity: 1, duration: 0.25, ease: "sine.inOut" }, 1.40);
      tl.to($("f07-dot"), { opacity: 0.25, duration: 0.2, ease: "sine.inOut" }, 1.65);

      /* 1.12 « parlez. » rises over the wave + peak impact */
      tl.fromTo($("f07-pw"), { yPercent: 105, opacity: 1, filter: "blur(10px)" }, { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "expo.out", immediateRender: false }, 1.12 - F);
      tl.fromTo($("f07-pw"), { scale: 1 }, { scale: 1.035, duration: 0.74 - 0.0, ease: "none", immediateRender: false }, 1.12 + 0.34 - F);
      FX.shake(tl, $("f07-shk1"), 1.14, { amp: 7, d: 0.24, n: 6, seed: 7 });
      tl.fromTo($("f07-streak1"), { opacity: 0, scaleX: 0.2, y: 70 }, { opacity: 0.9, scaleX: 1.2, y: 70, duration: 0.12, ease: "expo.out", immediateRender: false }, 1.12);
      tl.to($("f07-streak1"), { opacity: 0, scaleX: 1.6, duration: 0.3, ease: "power2.out" }, 1.24);

      /* captions scene 1 : « Avec [Synapze,] vous » 0.11 → 0.87, out at 1.05 */
      function cueWords(cap) {
        Array.prototype.forEach.call(cap.querySelectorAll(".w"), function (w) {
          var c = parseFloat(w.getAttribute("data-cue"));
          var at = c <= 1.86 && cap.id === "f07-cap2" ? c : Math.max(0.001, c - F);
          FX.cue(tl, w, at, { y: 18, d: 0.1 });
        });
      }
      cueWords($("f07-cap1"));
      FX.key(tl, $("f07-k1"), 0.36 - F);
      tl.fromTo($("f07-cap1"), { opacity: 1, y: 0 }, { opacity: 0, y: -10, duration: 0.1, ease: "power2.in", immediateRender: false }, 1.05);

      /* ================= Scene 2 (1.86 – 4.75) : the fiche writes itself ================= */
      tl.set($("f07-s1"), { opacity: 0 }, 1.86);
      tl.set($("f07-s2"), { opacity: 1 }, 1.86);
      FX.flash(tl, $("f07-flash"), 1.86, { peak: 0.55, d: 0.1 });

      /* discrete swaps of the real screen (never redrawn) */
      var SW = [["01", 1.86]];
      for (var j = 2; j <= 10; j++) SW.push([("0" + j).slice(-2), 2.40 + (j - 2) * 0.125]);
      for (var m = 11; m <= 16; m++) SW.push(["" + m, 3.48 + (m - 11) * 0.14]);
      SW.forEach(function (s, n) {
        tl.set($("f07-vn" + s[0]), { opacity: 1 }, s[1]);
        if (n > 0) tl.set($("f07-vn" + SW[n - 1][0]), { opacity: 0 }, s[1]);
      });

      /* the glass card arrives tilted and straightens (−16° → −6° in 0.6 s), then keeps drifting */
      var card = $("f07-card");
      tl.fromTo(card, { rotationY: -16, rotationX: 6, z: -120, y: 30 },
        { rotationY: -6, rotationX: 4, z: 0, y: 0, duration: 0.6, ease: "expo.out", immediateRender: false }, 1.86);
      tl.fromTo(card, { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.16, ease: "power2.out", immediateRender: false }, 1.86);
      tl.to(card, { rotationY: -5, rotationX: 3.4, duration: DUR - 2.46, ease: "none" }, 2.46);

      tl.fromTo($("f07-glow2"), { opacity: 0, scaleX: 0.8, scaleY: 0.3 }, { opacity: 0.9, scaleX: 1.15, scaleY: 0.38, duration: 0.6, ease: "power2.out", immediateRender: false }, 1.86);
      tl.fromTo($("f07-botfade"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, 1.86);
      /* white light sheen across the glass on arrival */
      tl.fromTo($("f07-sheen"), { x: 0, opacity: 0.85 }, { x: 2400, opacity: 0.85, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 1.9);
      tl.set($("f07-sheen"), { opacity: 0 }, 2.46);

      /* camera : creep, punch on the transcription (2.45), punch moved to Identité (3.48), drift */
      var cam = $("f07-cam2");
      /* baked target offsets from the frame centre, measured in the settled pose (card rotY −6, rotX 4) */
      var T_OFF = { x: 91, y: -96 }, I_OFF = { x: 90, y: 68 };
      var S1 = 1.38, S2 = 1.46;
      tl.fromTo(cam, { scale: 1, x: 0, y: 0 }, { scale: 1.03, duration: 0.59, ease: "none", immediateRender: false }, 1.86);
      FX.punch(tl, cam, 2.45, { s: S1, x: -T_OFF.x * S1, y: -T_OFF.y * S1, d: 0.2, drift: 0.035, hold: 0.83 });
      FX.punch(tl, cam, 3.48, { s: S2, x: -I_OFF.x * S2, y: -I_OFF.y * S2, d: 0.2, drift: 0.03, hold: DUR - 3.68 });

      /* 4.18 « REMPLIE AUTOMATIQUEMENT » : a short orange glint runs over the Identité block + rim light on the frame */
      tl.fromTo($("f07-sweep"), { x: 0, opacity: 1 }, { x: 1720, opacity: 1, duration: 0.42, ease: "power2.inOut", immediateRender: false }, 4.16);
      tl.set($("f07-sweep"), { opacity: 0 }, 4.58);
      tl.fromTo($("f07-rim"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power2.out", immediateRender: false }, 4.16);
      tl.to($("f07-rim"), { opacity: 0.35, duration: 0.45, ease: "power2.out" }, 4.26);
      tl.to($("f07-glow2"), { opacity: 1, scaleX: 1.3, duration: 0.12, ease: "expo.out" }, 4.16);
      tl.to($("f07-glow2"), { opacity: 0.85, scaleX: 1.2, duration: 0.4, ease: "power2.out" }, 4.3);

      /* captions scene 2, word by word, key box on « s’écrit. » */
      cueWords($("f07-cap2"));
      FX.key(tl, $("f07-k2"), 4.18 - F);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
    </script>
  </div>
</template>
