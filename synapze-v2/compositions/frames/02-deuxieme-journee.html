            return t.map((w, i) => { const s = document.createElement("span"); s.className = "fx-w"; s.textContent = w;
              el.appendChild(s); if (i < t.length - 1) el.appendChild(document.createTextNode(" ")); return s; }); },
          /* chromatic copies inside a .fx-chroma wrapper: returns {r, b} */
          chroma(wrap) { const txt = wrap.textContent; const mk = (c) => { const s = document.createElement("span"); s.className = c; s.textContent = txt; s.setAttribute("aria-hidden", "true"); wrap.appendChild(s); return s; };
            return { r: mk("r"), b: mk("b") }; },
          /* SLAM: element arrives too big + blurred and lands hard (1-4 frames), chromatic split snaps back */
          slam(tl, el, t, { from = 1.6, blur = 18, d = 0.12, chroma = null, rot = 0 } = {}) {
            tl.fromTo(el, { scale: from, opacity: 0, filter: `blur(${blur}px)`, rotation: rot }, { scale: 1, opacity: 1, filter: "blur(0px)", rotation: 0, duration: d, ease: "expo.out", immediateRender: false }, t);
            if (chroma) { tl.fromTo(chroma.r, { x: -14, opacity: .9 }, { x: 0, opacity: 0, duration: .28, ease: "power3.out", immediateRender: false }, t);
                          tl.fromTo(chroma.b, { x: 14, opacity: .9 }, { x: 0, opacity: 0, duration: .28, ease: "power3.out", immediateRender: false }, t); }
          },
          /* RISE: words mask-up one by one (wrap each .fx-w parent with overflow hidden yourself if you want a hard mask) */
          rise(tl, words, t, { stagger = 0.06, d = 0.32, y = 60 } = {}) {
            words.forEach((w, i) => tl.fromTo(w, { y, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: d, ease: "expo.out", immediateRender: false }, t + i * stagger)); },
          /* cue a single word exactly on its voice time */
          cue(tl, w, t, { y = 30, d = 0.14 } = {}) { tl.fromTo(w, { y, opacity: 0, filter: "blur(6px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: d, ease: "expo.out", immediateRender: false }, t); },
          /* SHAKE: deterministic camera shake on an impact (finite keyframes) */
          shake(tl, el, t, { amp = 14, d = 0.32, n = 7, seed = 1 } = {}) {
            for (let i = 0; i < n; i++) { const k = 1 - i / n; tl.to(el, { x: (FX.rnd(seed + i) - .5) * 2 * amp * k, y: (FX.rnd(seed + i + 50) - .5) * 2 * amp * k, duration: d / n, ease: "none" }, t + i * d / n); }
            tl.to(el, { x: 0, y: 0, duration: d / n, ease: "power2.out" }, t + d); },
          /* FLASH: 1-2 frame white (or ember) flash on a cut */
          flash(tl, el, t, { peak = 0.85, d = 0.1 } = {}) { tl.fromTo(el, { opacity: peak }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t); },
          /* WHIP: blur-pan out of a shot (exit) */
          whipOut(tl, el, t, { x = -900, d = 0.16 } = {}) { tl.to(el, { x, filter: "blur(28px)", duration: d, ease: "power3.in" }, t); },
          whipIn(tl, el, t, { x = 900, d = 0.22 } = {}) { tl.fromTo(el, { x, filter: "blur(28px)", opacity: 1 }, { x: 0, filter: "blur(0px)", duration: d, ease: "expo.out", immediateRender: false }, t); },
          /* PUNCH: fast zoom-in on a target (camera), then slow drift */
          punch(tl, cam, t, { s = 1.35, x = 0, y = 0, d = 0.18, drift = 0.04, hold = 1 } = {}) {
            tl.to(cam, { scale: s, x, y, duration: d, ease: "expo.out" }, t);
            tl.to(cam, { scale: s * (1 + drift), duration: hold, ease: "none" }, t + d); },
          /* KEY BOX: the orange box of a caption keyword opens left to right */
          key(tl, el, t) { tl.fromTo(el, { "--k": 0 }, { "--k": 1, duration: .14, ease: "power3.out", immediateRender: false }, t); },
          /* SHIMMER: gradient sweep through .fx-k.hot text */
          shimmer(tl, el, t, { d = 1.2 } = {}) { tl.fromTo(el, { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: d, ease: "power2.inOut", immediateRender: false }, t); },
          /* ROLL: digits text sequence (discrete, seek-safe) e.g. ["19:00","20:12","21:30","22:47"] at times */
          roll(tl, el, values, times) { values.forEach((v, i) => tl.set(el, { textContent: v }, times[i])); },
        };
        /* ===================== FX : fin du kit JS à copier ===================== */

        var tl = gsap.timeline({ paused: true });
        var ft = function (el, a, b, t) { b.immediateRender = false; tl.fromTo(el, a, b, t); };

        /* ---------------- constant layers ---------------- */
        // grain: re-seeded every 2 frames so the picture never dies, even frozen
        var grain = $("f02-grain");
        for (var g = 1; g * 2 * F < DUR; g++) {
          tl.set(grain, { backgroundPosition: Math.round(FX.rnd(g) * 256) + "px " + Math.round(FX.rnd(g + 400) * 256) + "px" }, g * 2 * F);
        }

        /* ================= SCENE 1 (0.00 - 1.79) ================= */
        var cam1 = $("f02-cam1"), glow = $("f02-glow");
        // camera push 4 %/s, a little more from 1.50
        ft(cam1, { scale: 1 }, { scale: 1.06, duration: 1.50, ease: "none" }, 0);
        tl.to(cam1, { scale: 1.10, duration: 0.29, ease: "power1.in" }, 1.50);
        // ember drifts on the left
        ft(glow, { x: 0, y: 0 }, { x: 70, y: -20, duration: 1.79, ease: "none" }, 0);

        // the empty CRM card behind: blurred 14 px, 30 %, tilted and settling; caret blinking
        var card = $("f02-card");
        ft($("f02-cardw"), { opacity: 0 }, { opacity: 0.3, duration: 0.25, ease: "power2.out" }, 0);
        ft(card, { rotationX: 16, rotationY: -18, z: -120, filter: "blur(14px)" },
                 { rotationX: 8, rotationY: -9, z: -60, filter: "blur(14px)", duration: 1.79, ease: "power1.out" }, 0);
        var c1 = $("f02-caret1");
        [0.27, 0.54, 0.81, 1.08, 1.35, 1.62].forEach(function (t, i) { tl.set(c1, { opacity: i % 2 ? 1 : 0 }, t); });

        // caption « Et votre », out at 0.50
        FX.cue(tl, $("f02-c1"), 0.13 - F, { y: 18, d: 0.1 });
        FX.cue(tl, $("f02-c2"), 0.24 - F, { y: 18, d: 0.1 });
        ft($("f02-caption"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.08, ease: "power2.in" }, 0.42);

        // 0.51 DEUXIÈME (outline) whips in from the right, 3D yaw settling
        var w1 = $("f02-w1"), w2 = $("f02-w2"), w3 = $("f02-w3");
        ft(w1, { opacity: 1, x: 1100, rotationY: -38, transformPerspective: 1400, filter: "blur(28px)" },
               { opacity: 1, x: 0, rotationY: 0, filter: "blur(0px)", duration: 0.26, ease: "expo.out" }, 0.51 - F);
        tl.to(w1, { x: -46, duration: 1.0, ease: "none" }, 0.51 - F + 0.26);
        // light streaks trailing the whoosh (right -> left)
        ft($("f02-st1"), { x: 700, opacity: 0.9 }, { x: -900, opacity: 0, duration: 0.24, ease: "power2.out" }, 0.51 - F);
        ft($("f02-st2"), { x: 900, opacity: 0.6 }, { x: -700, opacity: 0, duration: 0.28, ease: "power2.out" }, 0.53);

        // 0.93 JOURNÉE (fill) whips in from the left, chromatic split snaps back
        var ch2 = FX.chroma($("f02-w2c"));
        ft(w2, { opacity: 1, x: -1100, rotationY: 38, transformPerspective: 1400, filter: "blur(28px)" },
               { opacity: 1, x: 0, rotationY: 0, filter: "blur(0px)", duration: 0.26, ease: "expo.out" }, 0.93 - F);
        ft(ch2.r, { x: -16, opacity: 0.9 }, { x: 0, opacity: 0, duration: 0.28, ease: "power3.out" }, 0.93);
        ft(ch2.b, { x: 16, opacity: 0.9 }, { x: 0, opacity: 0, duration: 0.28, ease: "power3.out" }, 0.93);
        tl.to(w2, { x: 46, duration: 0.6, ease: "none" }, 0.93 - F + 0.26);
        ft($("f02-st3"), { x: -700, opacity: 0.9 }, { x: 900, opacity: 0, duration: 0.24, ease: "power2.out" }, 0.93 - F);
        ft($("f02-st4"), { x: -900, opacity: 0.6 }, { x: 700, opacity: 0, duration: 0.28, ease: "power2.out" }, 0.95);

        // 1.31 « commence. » rises, orange serif; soft impact (ember pulse + small shake)
        ft(w3, { opacity: 0, y: 110, scale: 0.92, filter: "blur(14px)" },
               { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, 1.31 - F);
        FX.shimmer(tl, w3, 1.31, { d: 0.48 });
        tl.to(w3, { y: -12, duration: 0.45, ease: "none" }, 1.31 - F + 0.34);
        tl.to(glow, { scale: 1.22, duration: 0.12, ease: "expo.out" }, 1.31);
        tl.to(glow, { scale: 1.08, duration: 0.36, ease: "power2.out" }, 1.43);
        FX.shake(tl, $("f02-shk"), 1.31, { amp: 6, d: 0.22, n: 5, seed: 3 });
        // the two Geist words step back a touch so the serif is the hero
        tl.to([w1, w2], { opacity: 0.82, duration: 0.2, ease: "power2.out" }, 1.31);

        /* ================= SCENE 2 (1.79 - 3.70) : silent time-lapse ================= */
        tl.set($("f02-s1"), { opacity: 0 }, 1.79);
        var flash = $("f02-flash");
        var CUTS = [1.79, 2.03, 2.27, 2.51, 2.75, 2.99, 3.23];
        var IDS = ["A", "B", "C", "D", "E", "F", "G"];
        // ember position per shot (alternating with the subject)
        var GLOW = [[1450, 380], [380, 640], [460, 400], [700, 760], [1480, 420], [1500, 620], [620, 560]];
        CUTS.forEach(function (t, i) {
          var shot = $("f02-s" + IDS[i]), z = $("f02-z" + IDS[i]);
          var end = i < CUTS.length - 1 ? CUTS[i + 1] : 3.30;
          var side = i % 2 ? 1 : -1;
          tl.set(shot, { opacity: 1 }, t);
          if (i < CUTS.length - 1) tl.set(shot, { opacity: 0 }, end);
          // mini zoom ×1 -> ×1.05 + lateral drift, alternating left/right
          if (i < CUTS.length - 1) ft(z, { scale: 1, x: -side * 24 }, { scale: 1.05, x: side * 24, duration: end - t, ease: "none" }, t);
          tl.set(glow, { x: GLOW[i][0] - 400, y: GLOW[i][1] - 430, scale: i === 6 ? 1.1 : 0.9 }, t);
          if (i < CUTS.length - 1) FX.flash(tl, flash, t, { peak: 0.42, d: F });
        });

        // clocks: hard cut, 2-frame settle, ghost echo in parallax, light streak
        [["A", -1], ["C", 1], ["E", -1]].forEach(function (c, k) {
          var id = c[0], s = c[1], t = CUTS[IDS.indexOf(id)];
          var main = $("f02-c" + id), ghost = $("f02-g" + id), streak = $("f02-l" + id);
          ft(main, { x: s * 150, scale: 1.06, filter: "blur(6px)" }, { x: s * 150, scale: 1, filter: "blur(0px)", duration: 0.07, ease: "expo.out" }, t);
          ft(ghost, { x: s * 150 - s * 70, scale: 1.2 }, { x: s * 150 + s * 50, scale: 1.24, duration: 0.24, ease: "none" }, t);
          ft(streak, { x: -s * 1300, opacity: 0.8 }, { x: s * 1300, opacity: 0, duration: 0.2, ease: "power2.out" }, t);
        });

        // the empty « Nom » field, macro, caret blinking (left, then right)
        ft($("f02-fB"), { rotationY: 20, rotationX: 4, x: -20, scale: 1.45 }, { rotationY: 16, rotationX: 4, x: -6, scale: 1.5, duration: 0.24, ease: "none" }, CUTS[1]);
        tl.set($("f02-kB"), { opacity: 0 }, CUTS[1] + 0.14);
        ft($("f02-fF"), { rotationY: -14, rotationX: -4, x: 560, y: 40, scale: 1.4 }, { rotationY: -11, rotationX: -4, x: 540, y: 40, scale: 1.44, duration: 0.24, ease: "none" }, CUTS[5]);
        tl.set($("f02-kF"), { opacity: 0 }, CUTS[5] + 0.12);
        tl.set($("f02-kF"), { opacity: 1 }, CUTS[5] + 0.21);

        // the coffee cup empties (brown circle shrinks), cup turns slowly
        ft($("f02-coffee"), { scale: 1 }, { scale: 0.22, duration: 0.24, ease: "power1.in" }, CUTS[3]);
        ft($("f02-cupr"), { rotation: -6 }, { rotation: 10, duration: 0.24, ease: "none" }, CUTS[3]);

        // 3.23 « 22:47 » slams (chroma, shake) ... 3.30 FREEZE
        var cg = $("f02-cG"), chG = FX.chroma($("f02-cGc"));
        ft(cg, { scale: 1.6, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.07, ease: "expo.out" }, CUTS[6]);
        ft(chG.r, { x: -16, y: 2, opacity: 0.95 }, { x: -3, y: 0, opacity: 0.85, duration: 0.07, ease: "power3.out" }, CUTS[6]);
        ft(chG.b, { x: 16, y: -2, opacity: 0.95 }, { x: 3, y: 0, opacity: 0.85, duration: 0.07, ease: "power3.out" }, CUTS[6]);
        FX.flash(tl, $("f02-flashE"), CUTS[6], { peak: 0.8, d: 0.07 });
        FX.shake(tl, $("f02-shk"), CUTS[6], { amp: 14, d: 0.06, n: 2, seed: 11 });
        // freeze: a one-frame zoom to ×1.06, chroma held at 3 px, heavier grain, scanlines 4 %
        ft($("f02-zG"), { scale: 1 }, { scale: 1.06, duration: F, ease: "none" }, 3.30);
        tl.set(grain, { opacity: 0.2 }, 3.30);
        tl.set($("f02-scan"), { opacity: 1 }, 3.30);

        tl.set({}, {}, DUR);
        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
  </div>
</template>
