            <div id="f10-cglow" class="fx-glow" style="left:960px;top:500px;width:900px;height:900px;margin:-450px 0 0 -450px"></div>
            <div id="f10-core"></div>
            <div id="f10-i1" class="f10-str thick" style="left:-300px;top:470px;width:700px"></div>
            <div id="f10-i2" class="f10-str thick" style="left:1520px;top:530px;width:700px"></div>
            <div id="f10-i3" class="f10-str" style="left:-200px;top:250px;width:600px"></div>
            <div id="f10-i4" class="f10-str" style="left:1500px;top:770px;width:600px"></div>
            <div id="f10-i5" class="f10-str" style="left:-250px;top:720px;width:560px"></div>
            <div id="f10-i6" class="f10-str" style="left:1560px;top:290px;width:560px"></div>
            <div id="f10-imb" class="fx-k"><span id="f10-imb-ch" class="fx-chroma"><span id="f10-imb-main" class="fx-k ink hot">IMBATTABLE.</span></span></div>
            <div id="f10-clk"><span class="f10-cdot"></span><span id="f10-clkv">19:00</span></div>
          </div>
        </div>
      </div>
      <div id="f10-cap" class="fx-cap ink"><span id="f10-c-elle" class="w">Elle</span> <span id="f10-c-le" class="w">le</span> <span id="f10-c-rend" class="w">rend</span></div>

      <!-- ============ END : night + orange line ============ -->
      <div id="f10-e1" class="f10-str f10-top" style="left:120px;top:539px;width:520px"></div>
      <div id="f10-e2" class="f10-str f10-top" style="left:1280px;top:539px;width:520px"></div>
      <div id="f10-line" class="f10-top"></div>
      <div id="f10-dot" class="f10-top"></div>

      <div id="f10-flash" class="fx-flash"></div>
      <div class="fx-vignette"></div><div class="fx-grain"></div>
    </div>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
    (function () {
      /* ===================== FX : début du kit JS à copier ===================== */
      /* All helpers add seek-safe tweens to the frame's paused timeline `tl`. Times are frame-local seconds. */
      const FX = {
        /* deterministic pseudo-random from an index (no random) */
        rnd: (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); },
        /* split text of el into .fx-w spans per word (call once at build) */
        words(el) { const t = el.textContent.trim().split(/\s+/); el.textContent = "";
          return t.map((w, i) => { const s = document.createElement("span"); s.className = "fx-w"; s.textContent = w;
            el.appendChild(s); if (i < t.length - 1) el.appendChild(document.createTextNode(" ")); return s; }); },
        /* chromatic copies inside a .fx-chroma wrapper: returns {r, b} */
        chroma(wrap) { const txt = wrap.textContent; const mk = (c) => { const s = document.createElement("span"); s.className = c; s.textContent = txt; s.setAttribute("aria-hidden", "true"); wrap.appendChild(s); return s; };
          return { r: mk("r"), b: mk("b") }; },
        /* SLAM: element arrives too big + blurred and lands hard (1-4 frames), chromatic split snaps back */
        slam(tl, el, t, { from = 1.6, blur = 18, d = 0.12, chroma = null, rot = 0 } = {}) {
          tl.fromTo(el, { scale: from, opacity: 0, filter: `blur(${blur}px)`, rotation: rot }, { scale: 1, opacity: 1, filter: "blur(0px)", rotation: 0, duration: d, ease: "expo.out", immediateRender: false }, t);
          if (chroma) { tl.fromTo(chroma.r, { x: -14, opacity: .9 }, { x: 0, opacity: 0, duration: .28, ease: "power3.out", immediateRender: false }, t);
                        tl.fromTo(chroma.b, { x: 14, opacity: .9 }, { x: 0, opacity: 0, duration: .28, ease: "power3.out", immediateRender: false }, t); }
        },
        /* RISE: words mask-up one by one (wrap each .fx-w parent with overflow hidden yourself if you want a hard mask) */
        rise(tl, words, t, { stagger = 0.06, d = 0.32, y = 60 } = {}) {
          words.forEach((w, i) => tl.fromTo(w, { y, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: d, ease: "expo.out", immediateRender: false }, t + i * stagger)); },
        /* cue a single word exactly on its voice time */
        cue(tl, w, t, { y = 30, d = 0.14 } = {}) { tl.fromTo(w, { y, opacity: 0, filter: "blur(6px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: d, ease: "expo.out", immediateRender: false }, t); },
        /* SHAKE: deterministic camera shake on an impact (finite keyframes) */
        shake(tl, el, t, { amp = 14, d = 0.32, n = 7, seed = 1 } = {}) {
          for (let i = 0; i < n; i++) { const k = 1 - i / n; tl.to(el, { x: (FX.rnd(seed + i) - .5) * 2 * amp * k, y: (FX.rnd(seed + i + 50) - .5) * 2 * amp * k, duration: d / n, ease: "none" }, t + i * d / n); }
          tl.to(el, { x: 0, y: 0, duration: d / n, ease: "power2.out" }, t + d); },
        /* FLASH: 1-2 frame white (or ember) flash on a cut */
        flash(tl, el, t, { peak = 0.85, d = 0.1 } = {}) { tl.fromTo(el, { opacity: peak }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t); },
        /* WHIP: blur-pan out of a shot (exit) */
        whipOut(tl, el, t, { x = -900, d = 0.16 } = {}) { tl.to(el, { x, filter: "blur(28px)", duration: d, ease: "power3.in" }, t); },
        whipIn(tl, el, t, { x = 900, d = 0.22 } = {}) { tl.fromTo(el, { x, filter: "blur(28px)", opacity: 1 }, { x: 0, filter: "blur(0px)", duration: d, ease: "expo.out", immediateRender: false }, t); },
        /* PUNCH: fast zoom-in on a target (camera), then slow drift */
        punch(tl, cam, t, { s = 1.35, x = 0, y = 0, d = 0.18, drift = 0.04, hold = 1 } = {}) {
          tl.to(cam, { scale: s, x, y, duration: d, ease: "expo.out" }, t);
          tl.to(cam, { scale: s * (1 + drift), duration: hold, ease: "none" }, t + d); },
        /* KEY BOX: the orange box of a caption keyword opens left to right */
        key(tl, el, t) { tl.fromTo(el, { "--k": 0 }, { "--k": 1, duration: .14, ease: "power3.out", immediateRender: false }, t); },
        /* SHIMMER: gradient sweep through .fx-k.hot text */
        shimmer(tl, el, t, { d = 1.2 } = {}) { tl.fromTo(el, { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: d, ease: "power2.inOut", immediateRender: false }, t); },
        /* ROLL: digits text sequence (discrete, seek-safe) e.g. ["19:00","20:12","21:30","22:47"] at times */
        roll(tl, el, values, times) { values.forEach((v, i) => tl.set(el, { textContent: v }, times[i])); },
      };
      /* ===================== FX : fin du kit JS à copier ===================== */

      const FID = "10-imbattable", DUR = 3.5, F = 1 / 30;
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const ft = (el, a, b, t) => { b.immediateRender = false; tl.fromTo(el, a, b, t); };

      /* ====================== SCENE 1 (0.00 – 2.06) : le courtier ====================== */
      // camera push 4 %/s, linear, never stops
      tl.fromTo($("f10-cam1"), { scale: 1 }, { scale: 1 + 0.04 * 2.06, duration: 2.06, ease: "none" }, 0);
      tl.fromTo($("f10-glow1"), { x: 0, y: 0 }, { x: -140, y: 40, duration: 2.06, ease: "none" }, 0);

      // line 1 : sits alone at centre, lifts when line 2 arrives
      tl.fromTo($("f10-l1"), { y: 128 }, { y: 0, duration: 0.42, ease: "expo.out", immediateRender: false }, 1.10);
      gsap.set($("f10-l1"), { y: 128, x: 339 }); gsap.set($("f10-l2"), { x: 409 });
      tl.set($("f10-l1"), { y: 128, x: 339 }, 0);
      tl.to($("f10-l1"), { x: 280.5, duration: 0.22, ease: "expo.out" }, 0.37 - F);
      tl.to($("f10-l1"), { x: 82.5, duration: 0.24, ease: "expo.out" }, 0.48 - F);
      tl.to($("f10-l1"), { x: 0, duration: 0.24, ease: "expo.out" }, 0.96 - F);
      // L'IA rises from the very first image (handoff_in), lands on its cue 0.13
      tl.fromTo($("f10-w-lia"), { y: 70, opacity: 0.35, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, 0);
      // ne : cue rise
      FX.cue(tl, $("f10-w-ne"), 0.37 - F, { y: 34, d: 0.16 });
      // remplace : side snap
      ft($("f10-w-rem"), { x: -70, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "expo.out" }, 0.48 - F);
      // pas : mini slam (the negation)
      FX.slam(tl, $("f10-w-pas"), 0.96 - F, { from: 1.7, blur: 12, d: 0.12 });

      // line 2 : « le courtier. » rises (le 1.13, courtier 1.25)
      FX.rise(tl, [$("f10-w-le"), $("f10-w-cour")], 1.13 - F, { stagger: 0.12, d: 0.42, y: 110 });
      ft($("f10-glow1b"), { opacity: 0, scale: 0.7 }, { opacity: 0.55, scale: 1, duration: 0.6, ease: "power2.out" }, 1.15);
      // micro drift of the serif hero against the push (parallax)
      tl.set($("f10-l2"), { x: 409 }, 0);
      tl.to($("f10-l2"), { x: 0, duration: 0.32, ease: "expo.out" }, 1.25 - F);
      tl.to($("f10-l2"), { x: -16, duration: 0.5, ease: "none" }, 1.56);

      // 1.40 – 2.00 : fly-through of the film's surfaces, back -> camera, blurred, 40 %
      const fly = [
        { id: "f10-c1", x: -420, y: -40, ry: 14, rz: -3 },
        { id: "f10-c2", x: 450, y: 30, ry: -16, rz: 4 },
        { id: "f10-c3", x: 0, y: -10, ry: 0, rz: 0 },
        { id: "f10-c4", x: -460, y: 40, ry: 12, rz: 3 },
        { id: "f10-c5", x: 430, y: -30, ry: -14, rz: -4 },
      ];
      fly.forEach((c, i) => {
        const t0 = 1.40 + i * 0.12, d = 0.34, el = $(c.id);
        ft(el, { x: c.x * 0.6, y: c.y, z: -2400, rotationY: c.ry, rotationZ: c.rz },
               { x: c.x, y: c.y * 1.6, z: 650, rotationY: c.ry * 0.4, rotationZ: 0, duration: d, ease: "power1.in" }, t0);
        ft(el, { opacity: 0 }, { opacity: 0.4, duration: 0.08, ease: "none" }, t0);
        tl.to(el, { opacity: 0, duration: 0.1, ease: "power1.in" }, t0 + d - 0.1);
      });
      // whoosh 1.40 : two light streaks cross behind the text
      ft($("f10-sa"), { x: -300, opacity: 0, scaleX: 0.4 }, { x: 1500, opacity: 0.8, scaleX: 1.4, duration: 0.3, ease: "power2.in" }, 1.40);
      tl.to($("f10-sa"), { opacity: 0, duration: 0.08, ease: "none" }, 1.62);
      ft($("f10-sb"), { x: 300, opacity: 0, scaleX: 0.4 }, { x: -1500, opacity: 0.7, scaleX: 1.4, duration: 0.3, ease: "power2.in" }, 1.52);
      tl.to($("f10-sb"), { opacity: 0, duration: 0.08, ease: "none" }, 1.74);

      /* ====================== CUT 2.06 ====================== */
      tl.set($("f10-s1"), { opacity: 0 }, 2.06 - F);
      tl.set($("f10-s2"), { opacity: 1 }, 2.06 - F);
      FX.flash(tl, $("f10-flash"), 2.06 - F, { peak: 0.55, d: 0.1 });

      /* ====================== SCENE 2 (2.06 – 3.50) : imbattable ====================== */
      // caption « Elle le rend », word by word, cleared hard on the slam
      FX.cue(tl, $("f10-c-elle"), 2.06 - F, { y: 18, d: 0.1 });
      FX.cue(tl, $("f10-c-le"), 2.25 - F, { y: 18, d: 0.1 });
      FX.cue(tl, $("f10-c-rend"), 2.35 - F, { y: 18, d: 0.1 });
      tl.set($("f10-cap"), { opacity: 0 }, 2.71 - F);

      // anticipation : ember gathers in the centre, streaks get sucked in
      ft($("f10-cglow"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.in" }, 2.08);
      tl.to($("f10-cglow"), { opacity: 0, scale: 1.8, duration: 0.3, ease: "power2.out" }, 2.69);
      tl.fromTo($("f10-cam2"), { scale: 1 }, { scale: 1.025, duration: 0.62, ease: "none" }, 2.06);
      ft($("f10-core"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2.5)" }, 2.12);
      tl.to($("f10-core"), { scale: 1.6, duration: 0.45, ease: "power2.in" }, 2.24);
      tl.set($("f10-core"), { opacity: 0 }, 2.71 - F);
      const inS = [["f10-i1", 1], ["f10-i2", -1], ["f10-i3", 1], ["f10-i4", -1], ["f10-i5", 1], ["f10-i6", -1]];
      inS.forEach((s, i) => {
        const t0 = 2.40 + i * 0.035, el = $(s[0]);
        ft(el, { x: 0, opacity: 0, scaleX: 0.5 }, { x: s[1] * 760, opacity: 0.9, scaleX: 1.3, duration: 0.27 - i * 0.02, ease: "power3.in" }, t0);
        tl.set(el, { opacity: 0 }, 2.69);
      });

      // 2.71 : SLAM « IMBATTABLE. » + chroma + shake + flash + punch ×1.12
      const imb = $("f10-imb"), ch = FX.chroma($("f10-imb-ch"));
      const mkCopy = (cls, before) => { const s = document.createElement("span"); s.className = cls; s.textContent = "IMBATTABLE."; s.setAttribute("aria-hidden", "true");
        const w = $("f10-imb-ch"); if (before) w.insertBefore(s, w.firstChild); else w.appendChild(s); return s; };
      const depth = mkCopy("f10-depth", true), sheen = mkCopy("f10-sheen", false);
      FX.slam(tl, imb, 2.71 - F, { from: 1.6, blur: 18, d: 0.12, chroma: ch });
      ft(depth, { y: 0, opacity: 0 }, { y: 26, opacity: 1, duration: 0.3, ease: "expo.out" }, 2.71);
      FX.flash(tl, $("f10-flash"), 2.71 - F, { peak: 0.7, d: 0.1 });
      FX.shake(tl, $("f10-shk"), 2.71, { amp: 14, d: 0.32, n: 7, seed: 10 });
      tl.to($("f10-cam2"), { scale: 1.12, duration: 0.18, ease: "expo.out" }, 2.71);
      tl.to($("f10-cam2"), { scale: 1.145, duration: 0.21, ease: "none" }, 2.89);
      ft($("f10-glow2"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "expo.out" }, 2.71);
      tl.to($("f10-glow2"), { scale: 1.08, duration: 0.14, ease: "none" }, 2.96);
      // impact burst : streaks fly out from the word
      inS.forEach((s, i) => {
        const el = $(s[0]);
        ft(el, { x: s[1] * 760, opacity: 0.85, scaleX: 1.3 }, { x: s[1] * -380, opacity: 0, scaleX: 0.6, duration: 0.3, ease: "expo.out" }, 2.72 + i * 0.012);
      });

      // 2.80 : shimmer (gradient sweep) + a one-pass white sheen band through the letters
      FX.shimmer(tl, $("f10-imb-main"), 2.80, { d: 0.5 });
      FX.shimmer(tl, sheen, 2.80, { d: 0.5 });

      // 2.77 – 2.93 : the clock rolls 19:00 -> 19:05 and lands
      FX.cue(tl, $("f10-clk"), 2.77, { y: 22, d: 0.14 });
      FX.roll(tl, $("f10-clkv"), ["19:00", "19:01", "19:02", "19:03", "19:04", "19:05"], [2.0, 2.8, 2.8333, 2.8667, 2.9, 2.9333]);
      ft($("f10-clkv"), { scale: 1.16, color: "#f24e1e" }, { scale: 1, color: "#0c0c0f", duration: 0.2, ease: "expo.out" }, 2.9333);

      // 3.10 – 3.45 : everything collapses into a 360 px orange line, ground turns to night
      const C0 = 3.10, CD = 0.35;
      tl.to($("f10-cam2"), { scale: 1, duration: CD, ease: "power3.in" }, C0);
      tl.to(imb, { scaleX: 0.235, scaleY: 0.02, y: 68, duration: CD, ease: "power3.in" }, C0);
      tl.to(imb, { opacity: 0, duration: 0.06, ease: "none" }, C0 + CD - 0.06);
      tl.to($("f10-clk"), { y: -110, scale: 0.2, opacity: 0, duration: 0.24, ease: "power3.in" }, C0);
      tl.to($("f10-glow2"), { scale: 0.15, opacity: 0, duration: CD, ease: "power3.in" }, C0);
      ft($("f10-night"), { opacity: 1, clipPath: "circle(0px at 960px 540px)" }, { clipPath: "circle(1150px at 960px 540px)", duration: 0.32, ease: "power3.in" }, 3.12);
      // whoosh 3.10 : trails converge on the line ends
      ft($("f10-e1"), { x: -500, opacity: 0, scaleX: 0.5 }, { x: 520, opacity: 0.9, scaleX: 1, duration: 0.3, ease: "power3.in" }, C0 + 0.04);
      tl.to($("f10-e1"), { opacity: 0, duration: 0.05, ease: "none" }, 3.40);
      ft($("f10-e2"), { x: 500, opacity: 0, scaleX: 0.5 }, { x: -520, opacity: 0.9, scaleX: 1, duration: 0.3, ease: "power3.in" }, C0 + 0.04);
      tl.to($("f10-e2"), { opacity: 0, duration: 0.05, ease: "none" }, 3.40);
      ft($("f10-line"), { opacity: 0, scaleX: 1.6 }, { opacity: 1, scaleX: 1, duration: 0.14, ease: "power3.in" }, 3.31);
      ft($("f10-dot"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.06, ease: "back.out(2.5)" }, 3.39);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
    </script>
  </div>
