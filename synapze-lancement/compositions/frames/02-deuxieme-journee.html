          });
          if (a[2] !== b[2]) {
            ft(h.cam, { scale: a[2] }, { scale: b[2], duration: dur, ease: Es }, t0);
            var kA = 1 / a[2], kB = 1 / b[2];
            var e = function (p) { return (1 / (a[2] + (b[2] - a[2]) * Es(p)) - kA) / (kB - kA); };
            ft(hudScale, { scale: kA }, { scale: kB, duration: dur, ease: e }, t0);
            ft(hudY, { scaleY: kA }, { scaleY: kB, duration: dur, ease: e }, t0);
            ft(hudX, { scaleX: kA }, { scaleX: kB, duration: dur, ease: e }, t0);
          }
        }
        // Scene 1: end of the whip. x keeps the handoff's +5200 px/s at 0.00 and lands at 0.30 (20:00 centered);
        // y and scale leave at rest (as the pilot left them) and settle at 0.45 on the P03 framing
        var WK = 5200 * 0.30 / (C1[0] - C0[0]);
        var whipEnd = function (p) { var q = Math.min(1, p * 0.45 / 0.30); return 1 - Math.pow(1 - q, WK); };
        camMove(0, 0.45, C0, C1, whipEnd, "power2.inOut", "power2.inOut");
        ft(h.cam, { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 0);
        // slow push (+2 %/s) about the card
        camMove(0.45, 1.45, C1, C2, "none");
        // Scene 2: pull (power3.out), the line from 19:00 to 23:00 enters the frame
        camMove(1.90, 0.40, C2, C3, "power3.out");
        // travelling right with the running point, settles under 21:00 (no going back before the push)
        var TK = Math.log(1 - (4757 - C3[0]) / (C4[0] - C3[0])) / Math.log(1 - 0.9 / 1.1);
        camMove(2.30, 1.10, C3, C4, function (p) { return 1 - Math.pow(1 - p, TK); });
        // push up toward the top of 21:00 (power3.in), blur 0 -> 10, in flight at the seam
        camMove(3.40, 0.30, C4, C5, "power3.in");
        ft(h.cam, { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.30, ease: "power3.in" }, 3.40);

        /* ---------------- Scene 1 (0.00 – 1.80): the empty card catches at 20:00 ---------------- */
        // the clock « 19:00 » leaves while the camera settles (P03 shows only the card, the line and the point)
        ft(clockA, { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power2.in" }, 0.40);
        // 1.00 -> 1.27 the card falls (×1.15, blur 8) and catches at 20:00 at 1.15, swings 2° once, then drifts 1°
        var hg = card.hang;
        ft(hg, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 1.00);
        ft(hg, { y: -300, scale: 1.15, rotation: 0, filter: "blur(8px)" }, { y: -14, scale: 1.03, filter: "blur(3px)", duration: 0.15, ease: "power2.in" }, 1.00);
        ft(hg, { y: -14, scale: 1.03, filter: "blur(3px)" }, { y: 0, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out" }, 1.15);
        ft(card.thread, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.12, ease: "expo.out" }, 1.15);
        ft(hg, { rotation: 0 }, { rotation: 2, duration: 0.2, ease: "sine.out" }, 1.27);
        ft(hg, { rotation: 2 }, { rotation: 0, duration: 0.2, ease: "sine.inOut" }, 1.47);
        ft(hg, { rotation: 0 }, { rotation: 1, duration: 0.6, ease: "sine.inOut" }, 2.00);
        ft(hg, { rotation: 1 }, { rotation: -0.6, duration: 0.8, ease: "sine.inOut" }, 2.60);
        ft(hg, { rotation: -0.6 }, { rotation: 0.4, duration: 0.8, ease: "sine.inOut" }, 3.40);
        // 1.28 -> 1.40 its labels print, fields empty
        ["f02-fd1", "f02-fd2", "f02-fd3", "f02-fd4"].forEach(function (id, i) {
          ft($(id), { opacity: 0, y: 8, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "power3.out" }, 1.28 + i * 0.04);
        });
        // 1.48 the orange caret blinks in « Nom » (finite on / off steps, never a repeat)
        ft($("f02-von"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power2.out" }, 1.48);
        var caret = $("f02-caret");
        [[1.48, 1], [1.98, 0], [2.23, 1], [2.73, 0], [2.98, 1], [3.48, 0]].forEach(function (b) { tl.set(caret, { opacity: b[1] }, b[0]); });

        /* ---------------- Scene 2 (1.80 – 3.70): the silent gag ---------------- */
        // the card recedes with the pull (one active subject: the point)
        // the card recedes and is hoisted on its thread (clears the running clock): thread 416 -> 676
        ft(hg, { scale: 1, y: 0 }, { scale: 0.6, y: -260, duration: 0.40, ease: "power3.out" }, 1.90);
        ft(card.thread, { scaleY: 1 }, { scaleY: 676 / 416, duration: 0.40, ease: "power3.out" }, 1.90);
        // 1.95 the clock « 19:00 » comes back over the point
        ft(clockB, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 1.95);
        // 2.10 -> 3.60 the point runs right, the hatched segment drawn behind it; it slows with the clock and stops dead
        // at 22:47 (passes 22:15 at 3.20 as in P04)
        var RUN = function (p) { return 0.351 * p + 0.649 * (1 - (1 - p) * (1 - p)); };
        ft([h.point, clockB], { x: 0 }, { x: XEND - X19, duration: 1.50, ease: RUN }, 2.10);
        tl.set(h.hatch, { opacity: 1 }, 2.10);
        ft(h.hatch, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.50, ease: RUN }, 2.10);
        // the clock clicks 20:12 (2.10), 21:30 (2.60), 22:15 (3.10), 22:47 (3.60), digit by digit
        steps.forEach(function (st) {
          ft(st.el, { y: 0 }, { y: -160, duration: 0.16, ease: "expo.out" }, st.t - 0.05 + st.col * 0.012);
        });
        // 2.60 « SAISIE · SAISIE · SAISIE · SAISIE » prints under the segment
        SZ.forEach(function (s, i) {
          ft(s, { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.12, ease: "power3.out" }, 2.60 + i * 0.15);
        });
        // 3.45 the notebook falls above 21:00 during the push (frame 03 catches it)
        ft(nb.hang, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 3.45);
        ft(nb.hang, { y: -700, scale: 1.15, rotation: 0, filter: "blur(8px)" }, { y: -60, scale: 1.08, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, 3.45);

        /* ---------------- subtitle: word by word, one key-word box ---------------- */
        Array.prototype.forEach.call($("f02-s1").querySelectorAll(".f02-w"), function (w) {
          var cue = parseFloat(w.getAttribute("data-cue"));
          ft(w, { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.08, ease: "expo.out" }, Math.max(0.001, cue - 1 / 30));
        });
        ft($("f02-k1"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out" }, 0.46);
        ft($("f02-s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.80);

        tl.set({}, {}, DUR);
        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
