      // status bar clock « 21:14 » → « 03:12 » as rolling digit columns (vertical ticker, one nested wrapper per step)
      var clk = $("f09-clk");
      var COLS = [["2", "0"], ["1", "3"], null, ["1"], ["4", "2"]];
      var steps = [];
      COLS.forEach(function (items, ci) {
        if (!items) { var c = document.createElement("span"); c.className = "f09-colon"; c.textContent = ":"; clk.appendChild(c); return; }
        var col = document.createElement("span"); col.className = "f09-col";
        var inner = col;
        for (var s = 0; s < items.length - 1; s++) {
          var w = document.createElement("span"); w.className = "f09-step"; inner.appendChild(w); inner = w;
          steps.push({ el: w, col: ci, k: s });
        }
        items.forEach(function (d) { var e = document.createElement("span"); e.className = "f09-dg"; e.textContent = d; inner.appendChild(e); });
        clk.appendChild(col);
      });

      /* ---------------- camera (world x/y, cam scale + filter) ---------------- */
      var C0 = [7000, 540, 1.0];                // handoff_in: top of the whip, +5000 px/s
      var WD = 0.57;                            // whip end: quad out, start speed 2·Δx/WD = 5000 px/s
      var C1 = [7000 + 5000 * WD / 2, 225, 1.0];
      var T2 = 2.95;
      var C2 = [8447.6, 212.4, 1.05];           // key image P15 at 2.95: phone 420 × 861 at (700, 2), push +2 %/s
      var C3 = [8600, 540, 0.6];                // handoff_out at 3.30, in the middle of a power3.out pull
      filCamSet(h, C0[0], C0[1], C0[2]);
      gsap.set(h.world, { x: 960 - C0[0], y: 540 - C0[1] });
      gsap.set(h.cam, { scale: C0[2], filter: "blur(12px)" });

      // marks of the line keep their screen size whatever the camera scale: counter scale 1 / s through an ease derived
      // from the camera ease (no callbacks, seek-safe)
      var hudScale = [].concat(h.ticks.map(function (t) { return t[0]; }), h.ticks.map(function (t) { return t[1]; }));
      var hudY = [h.orange];
      var hudX = [ph.thread, fm.thread];
      h.ticks.forEach(function (t) { gsap.set(t[1], { transformOrigin: "50% -30px" }); });
      function dotsAt(c) { return { x: 32 + c[2] * (1600 - c[0]), y: c[2] * (540 - c[1]) }; }  // c = [px, py, s]
      gsap.set(dots, dotsAt(C0));
      gsap.set(hudScale, { scale: 1 / C0[2] });
      gsap.set(hudY, { scaleY: 1 / C0[2] });
      gsap.set(hudX, { scaleX: 1 / C0[2] });

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }
      function easeOf(e) { return typeof e === "function" ? e : gsap.parseEase(e); }
      function camMove(t0, dur, a, b, ex, ey, es) {
        // a, b: [px, py, s]
        var Ex = easeOf(ex), Ey = easeOf(ey || ex), Es = easeOf(es || ey || ex);
        ft(h.world, { x: 960 - a[0] }, { x: 960 - b[0], duration: dur, ease: Ex }, t0);
        if (a[1] !== b[1]) ft(h.world, { y: 540 - a[1] }, { y: 540 - b[1], duration: dur, ease: Ey }, t0);
        var at = function (p) { return dotsAt([a[0] + (b[0] - a[0]) * Ex(p), a[1] + (b[1] - a[1]) * Ey(p), a[2] + (b[2] - a[2]) * Es(p)]); };
        ["x", "y"].forEach(function (k) {
          var g0 = at(0)[k], g1 = at(1)[k];
          if (Math.abs(g1 - g0) < 1e-6) return;
          var fv = {}, tv = { duration: dur, ease: function (p) { return (at(p)[k] - g0) / (g1 - g0); } };
          fv[k] = g0; tv[k] = g1; ft(dots, fv, tv, t0);
        });
        if (a[2] !== b[2]) {
          ft(h.cam, { scale: a[2] }, { scale: b[2], duration: dur, ease: Es }, t0);
          var kA = 1 / a[2], kB = 1 / b[2];
          var e = function (p) { return (1 / (a[2] + (b[2] - a[2]) * Es(p)) - kA) / (kB - kA); };
          ft(hudScale, { scale: kA }, { scale: kB, duration: dur, ease: e }, t0);
          ft(hudY, { scaleY: kA }, { scaleY: kB, duration: dur, ease: e }, t0);
          ft(hudX, { scaleX: kA }, { scaleX: kB, duration: dur, ease: e }, t0);
        }
      }
      // 0.00 → 0.57 end of the whip: x decelerates from +5000 px/s (quad out), y rises to the phone (starts at zero
      // speed: the seam only carries the horizontal whip); blur 12 → 0
      camMove(0, WD, C0, C1, "power1.out", "power2.inOut", "none");
      ft(h.cam, { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.28, ease: "power2.out" }, 0);
      // 0.57 → 2.95 slow push on the phone (+2 %/s)
      camMove(WD, T2 - WD, C1, C2, "none");
      // 2.95 → 3.30 the pull: a power3.out phrase of 0.75 s (it ends in frame 10) of which this frame plays the first
      // 0.35 s, rescaled so that 3.30 lands exactly on handoff_out, still moving
      var P3 = gsap.parseEase("power3.out"), PF = 0.35 / 0.75, P3F = P3(PF);
      var pullE = function (p) { return P3(p * PF) / P3F; };
      camMove(T2, DUR - T2, C2, C3, pullE);

      /* ---------------- the advice form leaves on the left (no own motion, the whip carries it) ---------------- */

      /* ---------------- the iPhone ---------------- */
      // 0.10 → 0.37 falls (×1.15, blur 8) and catches at « SAM. 21:14 », swings 2° once, then drifts 1°, upright for P15
      ft(ph.hang, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 0.10);
      ft(ph.hang, { y: -260, scale: 1.15, rotation: 0, filter: "blur(8px)" }, { y: -14, scale: 1.03, filter: "blur(3px)", duration: 0.15, ease: "power2.in" }, 0.10);
      ft(ph.hang, { y: -14, scale: 1.03, filter: "blur(3px)" }, { y: 0, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out" }, 0.25);
      ft(ph.thread, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.12, ease: "expo.out" }, 0.25);
      ft(ph.hang, { rotation: 0 }, { rotation: 2, duration: 0.2, ease: "sine.out" }, 0.37);
      ft(ph.hang, { rotation: 2 }, { rotation: 0, duration: 0.2, ease: "sine.inOut" }, 0.57);
      ft(ph.hang, { rotation: 0 }, { rotation: 0.8, duration: 0.7, ease: "sine.inOut" }, 0.77);
      ft(ph.hang, { rotation: 0.8 }, { rotation: -0.5, duration: 0.8, ease: "sine.inOut" }, 1.47);
      ft(ph.hang, { rotation: -0.5 }, { rotation: 0, duration: 0.68, ease: "sine.inOut" }, 2.27);

      // 0.25 WhatsApp opens
      ft($("f09-wa"), { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power3.out" }, 0.25);
      // 0.40 « Samedi », Camille's message 21:14
      function pop(el, t, from) {
        ft(el, Object.assign({ opacity: 0, scale: 0.9, filter: "blur(4px)" }, from || {}), { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, t);
      }
      pop($("f09-p1"), 0.40);
      pop($("f09-b1"), 0.46);
      // typing dots: three dots on a shared phase, finite steps (no repeat)
      function dotsLoop(el, t0, t1) {
        var ds = el.querySelectorAll("i"), P = 0.36;
        Array.prototype.forEach.call(ds, function (d, i) {
          for (var t = t0 + i * 0.09; t + P <= t1 + 0.001; t += P) {
            ft(d, { y: 0, opacity: 0.5 }, { y: -3, opacity: 1, duration: P / 2, ease: "sine.out" }, t);
            ft(d, { y: -3, opacity: 1 }, { y: 0, opacity: 0.5, duration: P / 2, ease: "sine.in" }, t + P / 2);
          }
        });
      }
      // 0.95 the assistant is typing (the dots stand where the reply lands)
      pop($("f09-ty1"), 0.95);
      dotsLoop($("f09-ty1"), 1.0, 1.40);
      ft($("f09-ty1"), { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "power2.in" }, 1.36);
      // 1.40 the reply lands (green bubble ×1.08 blurred → sharp in 0.12 s, 0.06 s before « répond »)
      ft($("f09-b2"), { opacity: 0, scale: 1.08, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out" }, 1.40);
      // 1.80 the ticks turn blue (read)
      ft($("f09-kg"), { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.out" }, 1.80);
      // 2.20 the status bar time rolls 21:14 → 03:12 (springs, one per step)
      steps.forEach(function (st) {
        ft(st.el, { y: 0 }, { y: -20, duration: 0.4, ease: "back.out(1.7)" }, 2.20 + st.col * 0.05 + st.k * 0.1);
      });
      // 2.50 « Aujourd'hui », Camille's answer 03:12
      pop($("f09-p2"), 2.50);
      pop($("f09-b3"), 2.58);
      // 2.80 typing again
      pop($("f09-ty2"), 2.80);
      dotsLoop($("f09-ty2"), 2.84, 3.12);
      ft($("f09-ty2"), { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "power2.in" }, 3.10);

      // 2.78 → 3.22 the next reply comes from the right, in the foreground, ×1.25 and blurred (P15 at 2.95),
      // then racks into focus as it lands in its slot (depth of field: foreground blurred, the phone sharp)
      var fly = $("f09-fly");
      var FLY_TOP = 470, FLY_W = 262, FLY_H = 56;       // landing slot (phone-local), measured on the layout
      var LX = 374 - FLY_W / 2, LY = FLY_TOP + FLY_H / 2; // landing center
      var KX = 676, KY = 479;                            // P15 center at 2.95, phone-local
      gsap.set(fly, { top: FLY_TOP });
      ft(fly, { x: KX - LX + 900, y: KY - LY + 40, scale: 1.46, rotation: -2, filter: "blur(8px)" },
        { x: KX - LX, y: KY - LY, filter: "blur(1.5px)", duration: 0.17, ease: "power3.out" }, 2.78);
      ft(fly, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 2.78);
      ft(fly, { x: KX - LX, y: KY - LY, scale: 1.46, rotation: -2, filter: "blur(1.5px)" },
        { x: 0, y: 0, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 3.0);

      /* ---------------- subtitle: word by word, one key-word box ---------------- */
      Array.prototype.forEach.call($("f09-s1").querySelectorAll(".f09-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue"));
        ft(w, { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.08, ease: "expo.out" }, Math.max(0.001, cue - 1 / 30));
      });
      ft($("f09-k1"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out" }, 2.52);
      // the subtitle leaves before the seam (handoff_out: subtitle out, gone 2 images before 3.30)
      ft($("f09-s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.06);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
