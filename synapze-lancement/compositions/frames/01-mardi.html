      ft(h.cam, { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.10, ease: "power2.out" }, 1.40);
      // Scene 2: slow drift, then the whip right along the line (blur 0 → 12) into handoff_out.
      // x: accelerating whip whose speed at 3.70 is the handoff's +5200 px/s (f(p) = a p² + b p³, f'(1) = 5200 · 0.3 / dx);
      // y and scale land on the line (540, ×1) with zero speed, so the next frame only carries the horizontal whip.
      var WV = 5200 * 0.30 / (PXW - PXD), WA = 3 - WV, WB = WV - 2;
      var whipX = function (p) { return WA * p * p + WB * p * p * p; };
      camMove(3.40, 0.30, [PXD, PYC, S1], [PXW, PYW, SW], whipX, "power2.inOut", "power2.inOut");
      ft(h.cam, { filter: "blur(0px)" }, { filter: "blur(12px)", duration: 0.30, ease: "power2.in" }, 3.40);

      /* ---------------- Scene 1 (0.00 – 1.50) ---------------- */
      // 0.00 → 0.27 the agenda falls (×1.15, blur 8) and catches at 18:00, swings 2° once, then drifts 1°
      ft(ag.hang, { y: -260, scale: 1.15, rotation: 0, filter: "blur(8px)" }, { y: -14, scale: 1.03, filter: "blur(3px)", duration: 0.15, ease: "power2.in" }, 0);
      ft(ag.hang, { y: -14, scale: 1.03, filter: "blur(3px)" }, { y: 0, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out" }, 0.15);
      ft(ag.thread, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.12, ease: "expo.out" }, 0.15);
      ft(ag.hang, { rotation: 0 }, { rotation: 2, duration: 0.2, ease: "sine.out" }, 0.27);
      ft(ag.hang, { rotation: 2 }, { rotation: 0, duration: 0.2, ease: "sine.inOut" }, 0.47);
      ft(ag.hang, { rotation: 0 }, { rotation: 1, duration: 0.6, ease: "sine.inOut" }, 1.20);
      ft(ag.hang, { rotation: 1 }, { rotation: -0.6, duration: 0.8, ease: "sine.inOut" }, 1.80);
      ft(ag.hang, { rotation: -0.6 }, { rotation: 0.4, duration: 0.8, ease: "sine.inOut" }, 2.60);
      // 0.30 graduations 19:00 and 20:00 print (0.04 s apart)
      [[h.ticks[2], 0.30], [h.ticks[3], 0.34]].forEach(function (p) {
        ft(p[0][0], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power3.out" }, p[1]);
        ft(p[0][1], { opacity: 0, y: 14, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, p[1]);
      });
      // 0.45 the point slides in from the left along the line and lands on 19:00
      ft(h.point, { x: -700 }, { x: 0, duration: 0.25, ease: "expo.out" }, 0.45);
      ft(h.point, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 0.45);
      // 0.60 « 19:00 » rolls above the point, digit by digit
      ft(h.clock, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power2.out" }, 0.60);
      steps.forEach(function (st) {
        ft(st.el, { y: 0 }, { y: -160, duration: 0.2, ease: "expo.out" }, 0.60 + st.col * 0.012 + st.k * 0.035);
      });
      // 1.00 the warm halo lights behind the point
      ft(h.halo, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.00);
      // foreground: a blurred graduation (×2.5) crosses low left, faster than the line (parallax)
      ft($("f01-fg"), { x: 760, y: 690 }, { x: 300, duration: 1.0, ease: "none" }, 0.30);
      ft($("f01-fg"), { opacity: 0 }, { opacity: 0.5, duration: 0.2, ease: "power2.out" }, 0.30);
      ft($("f01-fg"), { x: 300 }, { x: -500, duration: 0.2, ease: "expo.in" }, 1.30);

      /* ---------------- Scene 2 (1.50 – 3.70) ---------------- */
      // off screen during the close-up: the line past 19:00 becomes the grey of the evening to come
      tl.set(lineO, { opacity: 0 }, 2.40);
      var tab = $("f01-tab");
      // 2.19 the appointment label lifts
      ft(tab, { y: 0, scale: 1, filter: "drop-shadow(0px 0px 0px rgba(0,0,0,0)) blur(0px)" },
        { y: -4, scale: 1.02, filter: "drop-shadow(0px 6px 10px rgba(14,22,36,0.28)) blur(0px)", duration: 0.08, ease: "power3.out" }, 2.19);
      // 2.95 the orange tick is drawn in the box
      ft($("f01-ckb"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 2.95);
      ft($("f01-leg1"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.06, ease: "power2.in" }, 2.95);
      ft($("f01-leg2"), { opacity: 1, scaleY: 0 }, { scaleY: 1, duration: 0.09, ease: "power3.out" }, 3.01);
      // 3.00 → 3.15 on « partir » the label flies left out of frame
      ft(tab, { x: 0, rotation: 0, filter: "drop-shadow(0px 6px 10px rgba(14,22,36,0.28)) blur(0px)" },
        { x: -900, rotation: -8, filter: "drop-shadow(0px 6px 10px rgba(14,22,36,0.28)) blur(14px)", duration: 0.15, ease: "power2.in" }, 3.00);

      /* ---------------- subtitles: word by word, one key-word box per sentence ---------------- */
      ["f01-s1", "f01-s2"].forEach(function (s) {
        Array.prototype.forEach.call($(s).querySelectorAll(".f01-w"), function (w) {
          var cue = parseFloat(w.getAttribute("data-cue"));
          ft(w, { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.08, ease: "expo.out" }, Math.max(0.001, cue - 1 / 30));
        });
      });
      ft($("f01-k1"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out" }, 0.62);
      ft($("f01-k2"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out" }, 3.04);
      ft($("f01-s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.40);
      ft($("f01-s2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.40);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
