        ft(r, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 0.30 + i * 0.05);
      });
      ft($("f08-cl"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 0.55);
      ft($("f08-track"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 0.58);
      gsap.set($("f08-fill"), { scaleX: 0 });

      /* ---------------- 1.08 the boxes tick themselves, top to bottom, each with the « IA » chip ---------------- */
      Array.prototype.forEach.call(rows, function (r, i) {
        var t = 1.08 + i * 0.12;
        ft(r.querySelector(".f08-ckb"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, t);
        ft(r.querySelector(".f08-leg1"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.06, ease: "power2.in" }, t);
        ft(r.querySelector(".f08-leg2"), { opacity: 1, scaleY: 0 }, { scaleY: 1, duration: 0.09, ease: "power3.out" }, t + 0.06);
        ft(r.querySelector(".f08-ia"), { opacity: 0, scale: 0.6, x: 10 }, { opacity: 1, scale: 1, x: 0, duration: 0.14, ease: "expo.out" }, t + 0.04);
      });
      // 1.10 completeness fills (0.5 s power2.out)
      ft($("f08-fill"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 1.10);

      /* ---------------- 2.10 the stamp rushes from the camera, contact at 2.17 ---------------- */
      var stamp = $("f08-stamp");
      ft(stamp, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 2.10);
      ft(stamp, { scale: 3.4, rotation: -9, filter: "blur(12px)" }, { scale: 1, rotation: -6, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, 2.10);

      /* ---------------- subtitle: word by word, one key-word box ---------------- */
      Array.prototype.forEach.call($("f08-s1").querySelectorAll(".f08-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue"));
        ft(w, { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.08, ease: "expo.out" }, Math.max(0.001, cue - 1 / 30));
      });
      ft($("f08-k1"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out" }, 1.41);
      ft($("f08-s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.65);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
