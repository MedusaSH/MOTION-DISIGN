          fv[k] = g0; tv[k] = g1; ft(dots, fv, tv, t0);
        });
        if (a[2] !== b[2]) {
          ft(h.cam, { scale: a[2] }, { scale: b[2], duration: dur, ease: Es }, t0);
          var kA = 1 / a[2], kB = 1 / b[2];
          var e = function (p) { return (1 / (a[2] + (b[2] - a[2]) * Es(p)) - kA) / (kB - kA); };
          ft(hudScale, { scale: kA }, { scale: kB, duration: dur, ease: e }, t0);
          ft(hudY, { scaleY: kA }, { scaleY: kB, duration: dur, ease: e }, t0);
          ft(hudX, { scaleX: kA }, { scaleX: kB, duration: dur, ease: e }, t0);
        }
      }
      // 0.00 → 0.50 end of the travelling: it brakes onto the form (x power3.out keeps the incoming speed),
      // lifts and pushes in to the P08 framing; blur 8 → 0
      camMove(0, 0.50, C0, C1, "power3.out", "power2.inOut", "power2.inOut");
      ft(h.cam, { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.30, ease: "power2.out" }, 0);
      // 0.50 → 2.70 drift +16 px/s
      camMove(0.50, 2.20, C1, C2, "none");
      // 2.70 → 3.00 whip right along the line: accelerating curve whose speed at 3.00 is the handoff's +6000 px/s
      // (f(p) = A p² + B p³, f'(1) = 6000 · 0.3 / dx); y and scale land on the line (540, ×1) with zero speed
      var WV = 6000 * 0.30 / (CW[0] - C2[0]), WA = 3 - WV, WB = WV - 2;
      var whipX = function (p) { return WA * p * p + WB * p * p * p; };
      camMove(2.70, 0.30, C2, CW, whipX, "power2.inOut", "power2.inOut");
      ft(h.cam, { filter: "blur(0px)" }, { filter: "blur(14px)", duration: 0.30, ease: "expo.in" }, 2.70);

      /* ---------------- the advice form: enters right, drops, hangs at 22:30 ---------------- */
      gsap.set(doc.hang, { x: 420, y: -350, scale: 1.15, rotation: 0, filter: "blur(8px)" });
      ft(doc.hang, { x: 420 }, { x: 0, duration: 0.25, ease: "power3.out" }, 0);
      ft(doc.hang, { y: -350, scale: 1.15, filter: "blur(8px)" }, { y: -14, scale: 1.03, filter: "blur(3px)", duration: 0.15, ease: "power2.in" }, 0.10);
      ft(doc.hang, { y: -14, scale: 1.03, filter: "blur(3px)" }, { y: 0, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out" }, 0.25);
      ft(doc.thread, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.12, ease: "expo.out" }, 0.25);
      ft(doc.hang, { rotation: 0 }, { rotation: 2, duration: 0.2, ease: "sine.out" }, 0.37);
      ft(doc.hang, { rotation: 2 }, { rotation: 0, duration: 0.2, ease: "sine.inOut" }, 0.57);
      // living hold: drifts 1° then comes back level for the clicks (P08 at 2.40 is straight)
      ft(doc.hang, { rotation: 0 }, { rotation: 1, duration: 0.5, ease: "sine.inOut" }, 0.95);
      ft(doc.hang, { rotation: 1 }, { rotation: -0.4, duration: 0.5, ease: "sine.inOut" }, 1.45);
      ft(doc.hang, { rotation: -0.4 }, { rotation: 0, duration: 0.4, ease: "sine.inOut" }, 1.95);
      // the warm lamp behind it
      ft(h.halo, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.20);
      // 0.30 graduations 22:30 and 22:47 print
      [[h.ticks[2], 0.30], [h.ticks[3], 0.34]].forEach(function (p) {
        ft(p[0][0], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power3.out" }, p[1]);
        ft(p[0][1], { opacity: 0, y: 14, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, p[1]);
      });
      // 0.40 its five lines print, boxes empty
      [1, 2, 3, 4, 5].forEach(function (k, i) {
        ft($("f04-r" + k), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.18, ease: "power3.out" }, 0.40 + i * 0.05);
      });

      /* ---------------- the mouse arrow (form units: 1 px = 1 screen px at s 1.53) ---------------- */
      var cur = $("f04-cur");
      var TIPX = 104, ROW = function (k) { return 205 + 78 * (k - 1) + 8; };
      gsap.set(cur, { x: 1560, y: 600 });
      // 0.90 one curved move onto the first box (0.4 s power3.out; y on a softer ease draws the curve)
      tl.set(cur, { opacity: 1 }, 0.90);
      ft(cur, { x: 1560 }, { x: TIPX, duration: 0.40, ease: "power3.out" }, 0.90);
      ft(cur, { y: 600 }, { y: ROW(1), duration: 0.40, ease: "power1.out" }, 0.90);
      // 2.00 / 2.27 / 2.47 it ticks the first three boxes on the syllable
      var CLICK = [2.00, 2.27, 2.47];
      CLICK.forEach(function (t, i) {
        var k = i + 1, ck = $("f04-ck" + k), path = $("f04-tk" + k), rip = $("f04-rip" + k);
        gsap.set(rip, { left: 97, top: 205 + 78 * i });   // box center in form units
        // cursor press (scale .85, 0.06 s) and back
        ft(cur, { scale: 1 }, { scale: 0.85, duration: 0.06, ease: "power1.in" }, t);
        ft(cur, { scale: 0.85 }, { scale: 1, duration: 0.10, ease: "power2.out" }, t + 0.06);
        // box press-release-spring (×0.9 linear press, back.out release)
        ft(ck, { scale: 1 }, { scale: 0.9, duration: 0.06, ease: "power1.in" }, t);
        ft(ck, { scale: 0.9 }, { scale: 1, duration: 0.30, ease: "back.out(1.8)" }, t + 0.06);
        // the tick draws in 0.08 s, the box turns orange
        ft($("f04-ckb" + k), { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, t);
        ft(path, { strokeDashoffset: path.__len }, { strokeDashoffset: 0, duration: 0.08, ease: "power2.out" }, t);
        // accent ripple
        ft(rip, { opacity: 0.7, scale: 0.5 }, { opacity: 0, scale: 1.6, duration: 0.30, ease: "power2.out" }, t);
        // then the arrow slides to the next box
        var t1 = i < 2 ? CLICK[i + 1] - 0.15 : 2.55;
        ft(cur, { y: ROW(k) }, { y: ROW(k + 1), duration: 0.12, ease: "power3.out" }, t1);
      });

      // 2.60 the line stops at 22:47: the point lights there (two boxes stay empty)
      ft(h.point, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.12, ease: "power3.out" }, 2.60);

      /* ---------------- subtitle: word by word, one key-word box ---------------- */
      Array.prototype.forEach.call($("f04-s1").querySelectorAll(".f04-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue"));
        ft(w, { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.08, ease: "expo.out" }, Math.max(0.001, cue - 1 / 30));
      });
      ft($("f04-k1"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out" }, 1.95);
      ft($("f04-s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.76);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
