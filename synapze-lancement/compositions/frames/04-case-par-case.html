      adv.thread.id = "f04-advthread";
      // point and clock above the cards, the clock behind the form (it emerges from behind it on the whip)
      h.world.insertBefore(h.point, adv.thread); h.world.insertBefore(h.clock, adv.thread);

      // tick paths: measured length (svg-path-draw)
      [1, 2, 3].forEach(function (k) {
        var p = $("f04-tk" + k), len = 32;
        try { len = Math.ceil(p.getTotalLength()) + 1; } catch (e) {}
        p.style.strokeDasharray = len; p.style.strokeDashoffset = len; p.__len = len;
      });

      /* ---------------- camera: one source of truth, camAt(t) = [px, py, s] (frame 03 method) ---------------- */
      // handoff_in: cam(6300, 540, 0.9) at the end of frame 03's power3.in travelling: x speed +6950 px/s, scale speed -2/s.
      // P08 (2.40): cam(6600, 358, 1.53), the form centered on its 22:30 thread, the line at screen y 818. handoff_out: cam(7900, 540, 1), +6000 px/s.
      var S1 = 1.53, PXK = X2230, PYK = 358, VX = 16;
      var C0 = [6300, 540, 0.9];
      var C1 = [PXK + VX * (0.50 - 2.40), PYK, S1];
      var C2 = [PXK + VX * (2.70 - 2.40), PYK, S1];
      var CW = [7900, 540, 1];
      // x: brake with the incoming speed, f(p) = 1 - (1 - p)^n, f'(0) = n = 6950 * 0.5 / dx
      var NX = 6950 * 0.50 / (C1[0] - C0[0]);
      var brakeX = function (p) { return 1 - Math.pow(1 - p, NX); };
      // scale: keeps the incoming zoom-out speed, then pushes in; cubic with g'(0) = a, g'(1) = 0
      var SA = -2 * 0.50 / (C1[2] - C0[2]);
      var pushS = function (p) { return SA * p + (3 - 2 * SA) * p * p + (SA - 2) * p * p * p; };
      // whip x: accelerating, speed at 3.00 = +6000 px/s (f(p) = A p² + B p³, f'(1) = 6000 · 0.3 / dx)
      var WV = 6000 * 0.30 / (CW[0] - C2[0]), WA = 3 - WV, WB = WV - 2;
      var whipX = function (p) { return WA * p * p + WB * p * p * p; };
      var lin = function (p) { return p; };
      var SEGS = [
        [0.00, 0.50, C0, C1, brakeX, gsap.parseEase("power2.inOut"), pushS],
        [0.50, 2.20, C1, C2, lin, lin, lin],
        [2.70, 0.30, C2, CW, whipX, gsap.parseEase("power2.inOut"), gsap.parseEase("power2.inOut")],
      ];
      function camAt(t) {
        var s = SEGS[0];
        for (var i = SEGS.length - 1; i >= 0; i--) { if (t >= SEGS[i][0]) { s = SEGS[i]; break; } }
        var p = Math.min(1, Math.max(0, (t - s[0]) / s[1])), a = s[2], b = s[3];
        return [a[0] + (b[0] - a[0]) * s[4](p), a[1] + (b[1] - a[1]) * s[5](p), a[2] + (b[2] - a[2]) * s[6](p)];
      }
      function dotsAt(c) { return { x: 32 + c[2] * (1600 - c[0]), y: c[2] * (540 - c[1]) }; }  // pilot formula, c = [px, py, s]
      function mod48(v) { return ((v % 48) + 48) % 48; }
      // the hatched band: 36 px on screen at the seam (frame 03 does not counter-scale it), 40 px (P08) once landed
      function hatchK(c, t) { var m = t >= 0.5 ? 1 : 0.9 + 0.1 * pushS(Math.max(0, t) / 0.5); return m / c[2]; }

      filCamSet(h, C0[0], C0[1], C0[2]);
      gsap.set(h.world, { x: 960 - C0[0], y: 540 - C0[1] });
      gsap.set(h.cam, { scale: C0[2], filter: "blur(8px)" });

      var hudScale = [h.point, h.clock].concat(ticks.map(function (t) { return t[0]; }), ticks.map(function (t) { return t[1]; }), rows);
      var hudY = [h.orange, h.grey];
      var hudX = [cf.thread, e1.thread, e2.thread, e3.thread, adv.thread];
      gsap.set(h.clock, { transformOrigin: "50% 230px" });
      ticks.forEach(function (t) { gsap.set(t[1], { transformOrigin: "50% -30px" }); });
      gsap.set(rows, { transformOrigin: "0px -70px" });
      var D0 = dotsAt(C0);
      gsap.set(dots, { x: -48 + mod48(D0.x), y: -48 + mod48(D0.y) });
      gsap.set(hudScale, { scale: 1 / C0[2] });
      gsap.set(hudY, { scaleY: 1 / C0[2] });
      gsap.set(h.hatch, { scaleY: 1 });
      gsap.set(hudX, { scaleX: 1 / C0[2] });

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }
      // whole-frame drivers: value = ease(p), the ease returns the exact camera-derived value at t = p * DUR
      function drive(target, prop, fn) {
        var fv = {}, tv = { duration: DUR, immediateRender: false, ease: function (p) { return fn(camAt(p * DUR), p * DUR); } };
        fv[prop] = 0; tv[prop] = 1; tl.fromTo(target, fv, tv, 0);
      }
      drive(h.world, "x", function (c) { return 960 - c[0]; });
      drive(h.world, "y", function (c) { return 540 - c[1]; });
      drive(h.cam, "scale", function (c) { return c[2]; });
      drive(dots, "x", function (c) { return -48 + mod48(dotsAt(c).x); });
      drive(dots, "y", function (c) { return -48 + mod48(dotsAt(c).y); });
      drive(hudScale, "scale", function (c) { return 1 / c[2]; });
      drive(hudY, "scaleY", function (c) { return 1 / c[2]; });
      drive(h.hatch, "scaleY", hatchK);
      drive(hudX, "scaleX", function (c) { return 1 / c[2]; });
      // camera blur: end of the travelling (8 -> 0), the whip (0 -> 14)
      ft(h.cam, { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.30, ease: "power2.out" }, 0);
      ft(h.cam, { filter: "blur(0px)" }, { filter: "blur(14px)", duration: 0.30, ease: "expo.in" }, 2.70);

      /* ---------------- the advice form finishes its fall and hangs at 22:30 ---------------- */
      // landed: x1.3073 (1100 px on screen at s 1.53, P08), centered on its 22:30 thread (so it is off frame left at 3.00)
      var DOC_S = 1100 / (550 * S1);
      gsap.set(adv.hang, { y: -260, scale: 1.15, rotation: 0, filter: "blur(8px)" });
      // the fall keeps frame 03's speed (power2.in, ~7100 px/s): f(p) = 1.7 p - 0.7 p², then catches (expo.out)
      var fallE = function (p) { return 1.7 * p - 0.7 * p * p; };
      ft(adv.hang, { y: -260, scale: 1.15, filter: "blur(8px)" }, { y: -10, scale: DOC_S * 1.03, filter: "blur(3px)", duration: 0.06, ease: fallE }, 0);
      ft(adv.hang, { y: -10, scale: DOC_S * 1.03, filter: "blur(3px)" }, { y: 0, scale: DOC_S, filter: "blur(0px)", duration: 0.12, ease: "expo.out" }, 0.06);
      ft(adv.thread, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.12, ease: "expo.out" }, 0.06);
      // swings 2° once, then drifts (living hold), level again for the clicks
      ft(adv.hang, { rotation: 0 }, { rotation: 2, duration: 0.2, ease: "sine.out" }, 0.18);
      ft(adv.hang, { rotation: 2 }, { rotation: 0, duration: 0.2, ease: "sine.inOut" }, 0.38);
      ft(adv.hang, { rotation: 0 }, { rotation: 1, duration: 0.5, ease: "sine.inOut" }, 0.95);
      ft(adv.hang, { rotation: 1 }, { rotation: -0.4, duration: 0.5, ease: "sine.inOut" }, 1.45);
      ft(adv.hang, { rotation: -0.4 }, { rotation: 0, duration: 0.4, ease: "sine.inOut" }, 1.95);
      // the cards of frame 03 keep drifting a little while they leave on the left
      ft(cf.hang, { rotation: CF_ROT0 }, { rotation: 0.3, duration: 0.49, ease: "sine.out" }, 0);
      ft(e1.hang, { rotation: -0.8 }, { rotation: -0.3, duration: 0.6, ease: "sine.inOut" }, 0.10);

      // the big « 22:47 » clock would cover the form (P08): it fades after 0.10 (0.30 s), comes back on the whip
      ft(h.clock, { opacity: 1 }, { opacity: 0, duration: 0.30, ease: "power2.out" }, 0.12);
      ft(h.clock, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, 2.72);
      // 23:00 and the last SAISIE row are not part of P08 (the evening stops at 22:47): they fade (0.35 s)
      [h.ticks[4][0], h.ticks[4][1], rows[2]].forEach(function (el) {
        ft(el, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, 0.40);
      });
      // 0.30 graduations 22:30 and 22:47 print
      [[extra[0], 0.30], [extra[1], 0.34]].forEach(function (p) {
        ft(p[0][0], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power3.out" }, p[1]);
        ft(p[0][1], { opacity: 0, y: 14, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, p[1]);
      });

      /* ---------------- the mouse arrow (form units: 1 px = 1 screen px once landed at s 1.53) ---------------- */
      var cur = $("f04-cur");
      var TIPX = 104, ROW = function (k) { return 205 + 79 * (k - 1) + 8; };
      gsap.set(cur, { x: 1560, y: 600 });
      // 0.90 one curved move onto the first box (0.4 s power3.out; y on a softer ease draws the curve)
      tl.set(cur, { opacity: 1 }, 0.90);
      ft(cur, { x: 1560 }, { x: TIPX, duration: 0.40, ease: "power3.out" }, 0.90);
      ft(cur, { y: 600 }, { y: ROW(1), duration: 0.40, ease: "power1.out" }, 0.90);
      // 2.00 / 2.27 / 2.47 it ticks the first three boxes on the syllable
      var CLICK = [2.00, 2.27, 2.47];
      CLICK.forEach(function (t, i) {
        var k = i + 1, ck = $("f04-ck" + k), path = $("f04-tk" + k), rip = $("f04-rip" + k);
        gsap.set(rip, { left: 97, top: 205 + 79 * i });   // box center in form units
        // cursor press (scale .85, 0.06 s) and back
        ft(cur, { scale: 1 }, { scale: 0.85, duration: 0.06, ease: "power1.in" }, t);
        ft(cur, { scale: 0.85 }, { scale: 1, duration: 0.10, ease: "power2.out" }, t + 0.06);
        // box press-release-spring (x0.9 linear press, back.out release)
        ft(ck, { scale: 1 }, { scale: 0.9, duration: 0.06, ease: "power1.in" }, t);
        ft(ck, { scale: 0.9 }, { scale: 1, duration: 0.30, ease: "back.out(1.8)" }, t + 0.06);
        // the tick draws in 0.08 s, the box turns orange
        ft($("f04-ckb" + k), { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, t);
        ft(path, { strokeDashoffset: path.__len }, { strokeDashoffset: 0, duration: 0.08, ease: "power2.out" }, t);
        // accent ripple
        ft(rip, { opacity: 0.7, scale: 0.5 }, { opacity: 0, scale: 1.6, duration: 0.30, ease: "power2.out" }, t);
        // then the arrow slides to the next box (the fourth stays empty under it)
        var t1 = i < 2 ? CLICK[i + 1] - 0.15 : 2.55;
        ft(cur, { y: ROW(k) }, { y: ROW(k + 1), duration: 0.12, ease: "power3.out" }, t1);
      });

      /* ---------------- subtitle: word by word, one key-word box ---------------- */
      Array.prototype.forEach.call($("f04-s1").querySelectorAll(".f04-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue"));
        ft(w, { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.08, ease: "expo.out" }, Math.max(0.001, cue - 1 / 30));
      });
      ft($("f04-k1"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out" }, 1.95);
      ft($("f04-s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.76);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
