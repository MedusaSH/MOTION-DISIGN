/* el(parent, cls, style, text): small DOM helper, deterministic, no measuring. */
function filEl(parent, cls, style = {}, text) {
  const e = document.createElement("div"); e.className = cls;
  for (const k in style) e.style[k] = typeof style[k] === "number" ? style[k] + "px" : style[k];
  if (text != null) e.textContent = text; parent.appendChild(e); return e;

/* filBuild(root, opts) builds stage > cam > world and the line. Returns handles the frame animates with GSAP.
   opts: ground ("dark" | "light" | "black"), x0, x1 (world span of the line), orangeTo (world x where orange becomes grey,
   Infinity = all orange), ticks ([[x, "19:00"], ...]), hatch ([x0, x1] or null), point (world x or null), clock (text or null). */
function filBuild(root, o = {}) {
  const ground = filEl(root, "fil-ground " + (o.ground || "dark"));
  const stage = filEl(root, "fil-stage" + (o.ground === "light" ? " on-light" : ""));

  const x0 = o.x0 ?? 0, x1 = o.x1 ?? 12000, cut = Math.min(o.orangeTo ?? Infinity, x1);
  const orange = filEl(world, "fil-line", { left: x0, top: FIL.Y, width: Math.max(0, cut - x0) });
  const grey = cut < x1 ? filEl(world, "fil-line grey", { left: cut, top: FIL.Y, width: x1 - cut }) : null;
  const hatch = o.hatch ? filEl(world, "fil-hatch", { left: o.hatch[0], top: FIL.Y, width: o.hatch[1] - o.hatch[0] }) : null;
  const hatchLabel = o.hatch ? filEl(world, "fil-hatch-l", { left: o.hatch[0] + 10, top: FIL.Y + 70 }, "SAISIE · SAISIE · SAISIE · SAISIE") : null;

  const point = o.point != null ? filEl(world, "fil-point", { left: o.point, top: FIL.Y }) : null;
  const clock = o.clock != null ? filEl(world, "fil-clock", { left: o.point ?? 2400, top: FIL.Y - 230 }, o.clock) : null;
  return { ground, stage, cam, world, halo, orange, grey, hatch, hatchLabel, ticks, point, clock };

/* filHang(world, x, el, {len}) hangs a DOM object above the line at world x by a thread of length len (px).

function filHang(world, x, el, { len = 130 } = {}) {
  const thread = filEl(world, "fil-thread", { left: x, top: FIL.Y - len, height: len });
  const hang = filEl(world, "fil-hang", { left: x, top: FIL.Y - len }); hang.appendChild(el);

}

          if (hudScale.length) ft(hudScale, { scale: kA }, { scale: kB, duration: dur, ease: e }, t0);

          if (hudX.length) ft(hudX, { scaleX: kA }, { scaleX: kB, duration: dur, ease: e }, t0);

      var whipX = function (p) { return WA * p * p + WB * p * p * p; };
      camMove(4.45, 0.30, C4, CW, whipX, "power2.inOut", "power2.inOut");
      ft(h.cam, { filter: "blur(0px)" }, { filter: "blur(12px)", duration: 0.30, ease: "expo.in" }, 4.45);

      /* ---------------- Scene 1 (0.00 – 1.80) : vous parlez ---------------- */
      // t = 0: only the centre bar, 8 × 120, on the line (handoff_in)
      var c0 = bars[NB];
      gsap.set(c0.el, { scaleY: 120 / c0.H, transformOrigin: "50% 50%" });
      // 0.10 the bar multiplies along the line on both sides (0.015 s apart); the line front recedes with it
      var T_SPREAD = 0.10, STEP = 0.015, T_VOICE = 0.40;
      bars.forEach(function (b) {
        if (b.k === 0) return;
        var ak = Math.abs(b.k), t = T_SPREAD + ak * STEP;
        gsap.set(b.el, { transformOrigin: "50% 50%" });
        var pre = t < T_VOICE ? (120 * (1 - 0.5 * ak / 20)) / b.H : 1;  // before 0.40 a tapered seed, after it the real voice
        ft(b.el, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: pre, duration: 0.08, ease: "expo.out" }, t);
        if (pre !== 1) ft(b.el, { scaleY: pre }, { scaleY: 1, duration: 0.22, ease: "power3.out" }, Math.max(T_VOICE + ak * 0.006, t + 0.09));
      });
      // the centre bar follows the voice too
      ft(c0.el, { scaleY: 120 / c0.H }, { scaleY: 1, duration: 0.22, ease: "power3.out" }, T_VOICE);
      var T_END = T_SPREAD + NB * STEP;   // 1.15
      ft(lineR, { x: 0 }, { x: NB * PITCH, duration: T_END - T_SPREAD, ease: "none" }, T_SPREAD);
      ft(lineL, { x: 0 }, { x: -NB * PITCH, duration: T_END - T_SPREAD, ease: "none" }, T_SPREAD);
      // 0.40 → 2.40 live amplitude of the real voice (RMS every 1/15 s), peak on « parlez » at 1.12
      var G = [0.3,0.55,0.79,0.58,0.23,0.2,0.24,0.1,0.13,0.24,0.33,0.27,0.17,0.7,0.44,0.32,0.29,0.16,0.03,0.0,0.0,0.0,0.56,1.0,0.93,0.81,0.47,0.31,0.65,0.38,0.43];
      var prevG = 1;
      for (var i = 0; i < G.length; i++) {
        var ta = (7 + i) / 15;                         // value reached at 0.467, 0.533, … (tween starts 1/15 s before)
        var v = 0.8 + 0.3 * G[i];
        if (Math.abs(ta - 1.0667) < 0.01) v = 1.06;
        if (Math.abs(ta - 1.1333) < 0.01) v = 1.24;    // the peak, on « parlez »
        if (Math.abs(ta - 1.2) < 0.01) v = 1.0;        // P12
        ft(gain, { scaleY: prevG }, { scaleY: v, duration: 1 / 15, ease: "sine.inOut" }, ta - 1 / 15);
        prevG = v;
      }
      ft(gain, { scaleY: prevG }, { scaleY: 1, duration: 0.2, ease: "sine.inOut" }, (7 + G.length) / 15 - 1 / 15);
      // 0.80 the « Enregistrement… » button lands above the wave (×1.2 blurred → sharp, 0.08 s)
      ft(recin, { opacity: 0, scale: 1.2, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.08, ease: "expo.out" }, 0.80);
      // 1.50 → 2.30 the wave runs right toward the Synapze screen (the line ahead of it goes with it)
      var RUN = 900;
      ft(scroll, { x: 0 }, { x: RUN, duration: 0.80, ease: "power2.inOut" }, 1.50);
      ft(lineR, { x: NB * PITCH }, { x: NB * PITCH + RUN, duration: 0.80, ease: "power2.inOut" }, 1.50);
      ft(lineL, { x: -NB * PITCH }, { x: -NB * PITCH + RUN, duration: 0.80, ease: "power2.inOut" }, 1.50);

      /* ---------------- Scene 2 (1.80 – 4.75) : la fiche s'écrit ---------------- */
      tl.set(lap, { opacity: 1 }, 1.70);          // still off frame (screen x > 2200)
      // the real screen, stepped: discrete swaps of the site-video stills, no crossfade
      var SW = [
        [2.40, 2], [2.50, 3], [2.63, 4], [2.76, 5], [2.89, 6], [3.02, 7], [3.15, 8], [3.28, 9], [3.40, 10],   // transcription types in
        [3.48, 11], [3.60, 12], [3.72, 13], [3.84, 14], [3.96, 15], [4.18, 16],                             // Identité fills (IA chips)
      ];
      var vid = function (n) { return $("f07-vn" + (n < 10 ? "0" : "") + n); };
      var cur = 1;
      SW.forEach(function (s) {
        tl.set(vid(s[1]), { opacity: 1 }, s[0]);
        tl.set(vid(cur), { opacity: 0 }, s[0]);
        cur = s[1];
      });

      /* ---------------- subtitles: word by word, one key-word box per sentence, peak stroke ---------------- */
      ["f07-s1", "f07-s2"].forEach(function (s) {
        Array.prototype.forEach.call($(s).querySelectorAll(".f07-w"), function (w) {
          var cue = parseFloat(w.getAttribute("data-cue"));
          ft(w, { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.08, ease: "expo.out" }, Math.max(0.001, cue - 1 / 30));
        });
      });
      ft($("f07-k1"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out" }, 0.31);
      ft($("f07-tr1"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, 1.02);
      ft($("f07-k2"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out" }, 4.13);
      ft($("f07-s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.70);
      ft($("f07-s2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 4.45);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
