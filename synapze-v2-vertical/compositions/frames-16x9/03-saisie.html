        <div class="f03-cam" id="f03-wall"></div>
        <div id="f03-bandbg"></div>
        <div id="f03-bandrot">
          <div id="f03-band"><span class="fx-w">FICHE</span><span class="fx-w hot">PAR</span><span class="fx-w">FICHE</span><span class="fx-w hot">PAR</span><span class="fx-w">FICHE</span></div>
        </div>
      </div>

      <div class="fx-flash" id="f03-flash"></div>
      <div class="fx-vignette"></div>
      <div class="fx-grain" id="f03-grain"></div>
    </div>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "03-saisie";
      var DUR = 5.8;
      var F = 1 / 30;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      var $ = function (id) { return root.querySelector("#" + id); };
      var $$ = function (sel, el) { return Array.prototype.slice.call((el || root).querySelectorAll(sel)); };

/* ===================== FX : début du kit JS à copier ===================== */
/* All helpers add seek-safe tweens to the frame's paused timeline `tl`. Times are frame-local seconds. */
const FX = {
  /* deterministic pseudo-random from an index (no random) */
  rnd: (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); },
  /* split text of el into .fx-w spans per word (call once at build) */
  words(el) { const t = el.textContent.trim().split(/\s+/); el.textContent = "";
    return t.map((w, i) => { const s = document.createElement("span"); s.className = "fx-w"; s.textContent = w;
      el.appendChild(s); if (i < t.length - 1) el.appendChild(document.createTextNode(" ")); return s; }); },
  /* chromatic copies inside a .fx-chroma wrapper: returns {r, b} */
  chroma(wrap) { const txt = wrap.textContent; const mk = (c) => { const s = document.createElement("span"); s.className = c; s.textContent = txt; s.setAttribute("aria-hidden", "true"); wrap.appendChild(s); return s; };
    return { r: mk("r"), b: mk("b") }; },
  /* SLAM: element arrives too big + blurred and lands hard (1-4 frames), chromatic split snaps back */
  slam(tl, el, t, { from = 1.6, blur = 18, d = 0.12, chroma = null, rot = 0 } = {}) {
    tl.fromTo(el, { scale: from, opacity: 0, filter: `blur(${blur}px)`, rotation: rot }, { scale: 1, opacity: 1, filter: "blur(0px)", rotation: 0, duration: d, ease: "expo.out", immediateRender: false }, t);
    if (chroma) { tl.fromTo(chroma.r, { x: -14, opacity: .9 }, { x: 0, opacity: 0, duration: .28, ease: "power3.out", immediateRender: false }, t);
                  tl.fromTo(chroma.b, { x: 14, opacity: .9 }, { x: 0, opacity: 0, duration: .28, ease: "power3.out", immediateRender: false }, t); }
  },
  /* RISE: words mask-up one by one (wrap each .fx-w parent with overflow hidden yourself if you want a hard mask) */
  rise(tl, words, t, { stagger = 0.06, d = 0.32, y = 60 } = {}) {
    words.forEach((w, i) => tl.fromTo(w, { y, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: d, ease: "expo.out", immediateRender: false }, t + i * stagger)); },
  /* cue a single word exactly on its voice time */
  cue(tl, w, t, { y = 30, d = 0.14 } = {}) { tl.fromTo(w, { y, opacity: 0, filter: "blur(6px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: d, ease: "expo.out", immediateRender: false }, t); },
  /* SHAKE: deterministic camera shake on an impact (finite keyframes) */
  shake(tl, el, t, { amp = 14, d = 0.32, n = 7, seed = 1 } = {}) {
    for (let i = 0; i < n; i++) { const k = 1 - i / n; tl.to(el, { x: (FX.rnd(seed + i) - .5) * 2 * amp * k, y: (FX.rnd(seed + i + 50) - .5) * 2 * amp * k, duration: d / n, ease: "none" }, t + i * d / n); }
    tl.to(el, { x: 0, y: 0, duration: d / n, ease: "power2.out" }, t + d); },
  /* FLASH: 1-2 frame white (or ember) flash on a cut */
  flash(tl, el, t, { peak = 0.85, d = 0.1 } = {}) { tl.fromTo(el, { opacity: peak }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t); },
  /* WHIP: blur-pan out of a shot (exit) */
  whipOut(tl, el, t, { x = -900, d = 0.16 } = {}) { tl.to(el, { x, filter: "blur(28px)", duration: d, ease: "power3.in" }, t); },
  whipIn(tl, el, t, { x = 900, d = 0.22 } = {}) { tl.fromTo(el, { x, filter: "blur(28px)", opacity: 1 }, { x: 0, filter: "blur(0px)", duration: d, ease: "expo.out", immediateRender: false }, t); },
  /* PUNCH: fast zoom-in on a target (camera), then slow drift */
  punch(tl, cam, t, { s = 1.35, x = 0, y = 0, d = 0.18, drift = 0.04, hold = 1 } = {}) {
    tl.to(cam, { scale: s, x, y, duration: d, ease: "expo.out" }, t);
    tl.to(cam, { scale: s * (1 + drift), duration: hold, ease: "none" }, t + d); },
  /* KEY BOX: the orange box of a caption keyword opens left to right */
  key(tl, el, t) { tl.fromTo(el, { "--k": 0 }, { "--k": 1, duration: .14, ease: "power3.out", immediateRender: false }, t); },
  /* SHIMMER: gradient sweep through .fx-k.hot text */
  shimmer(tl, el, t, { d = 1.2 } = {}) { tl.fromTo(el, { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: d, ease: "power2.inOut", immediateRender: false }, t); },
  /* ROLL: digits text sequence (discrete, seek-safe) e.g. ["19:00","20:12","21:30","22:47"] at times */
  roll(tl, el, values, times) { values.forEach((v, i) => tl.set(el, { textContent: v }, times[i])); },
};
/* ===================== FX : fin du kit JS à copier ===================== */

      var tl = gsap.timeline({ paused: true });
      var ft = function (el, a, b, t) { b.immediateRender = false; return tl.fromTo(el, a, b, t); };
      // a word appears on its voice cue, one frame early
      var early = function (t) { return Math.max(0.001, t - F); };

      /* ---------------- ambient: glow drift + live grain (whole frame) ---------------- */
      tl.fromTo($("f03-glow"), { x: 0, y: 0, scale: 1 }, { x: -160, y: 60, scale: 1.12, duration: DUR, ease: "none" }, 0);
      var grain = $("f03-grain");
      for (var g = 0; g * 2 * F < DUR; g++) {
        tl.set(grain, { x: Math.round((FX.rnd(g + 7) - .5) * 80), y: Math.round((FX.rnd(g + 91) - .5) * 80) }, g * 2 * F);
      }

      /* ================= SCENE 1 (0.00 – 2.02) : le conseil ================= */
      var page1 = $("f03-p1");
      // handoff_in: the tilted page enters blurred from below, lands at 0.25
      tl.fromTo(page1, { y: 340, scale: 1.06, filter: "blur(16px)", opacity: 0.85 },
        { y: 0, scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.25, ease: "expo.out" }, 0);
      // camera track: rotateX 10° -> 4° and a slow push
      tl.fromTo($("f03-tilt1"), { rotationX: 10, transformOrigin: "50% 80%" }, { rotationX: 4, duration: 2.02, ease: "none" }, 0);
      tl.fromTo($("f03-cam1"), { scale: 1 }, { scale: 1.05, duration: 2.02, ease: "none" }, 0);

      // handwriting: each line is written left to right, a glowing pen tip rides the stroke
      var writes = [["f03-n1", 0.30, 0.20], ["f03-n2", 0.52, 0.26], ["f03-n3", 0.80, 0.20], ["f03-n4", 1.05, 0.16]];
      var pen = $("f03-pen");
      tl.set(pen, { opacity: 1 }, 0.30);
      writes.forEach(function (w) {
        var el = $(w[0]);
        tl.set(el, { opacity: 1 }, w[1]);
        ft(el, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: w[2], ease: "none" }, w[1]);
        var top = parseFloat(el.style.top) + 48, wid = el.scrollWidth || 700;
        ft(pen, { x: 160, y: top }, { x: 160 + wid, y: top - 6, duration: w[2], ease: "none" }, w[1]);
      });
      tl.set(pen, { opacity: 0 }, 1.21);

      // 1.12: the page recedes (depth, blur, dimmed) and « le conseil. » rises in front
      ft($("f03-recede"), { z: 0, y: 0, filter: "blur(0px) brightness(1)", opacity: 1 },
        { z: -520, y: -30, filter: "blur(9px) brightness(0.38)", opacity: 0.9, duration: 0.55, ease: "expo.out" }, 1.12);
      ft($("f03-streak1"), { opacity: 0, x: -900, scaleX: 0.4 }, { opacity: 0.8, x: 300, scaleX: 1, duration: 0.18, ease: "power2.out" }, 1.10);
      tl.to($("f03-streak1"), { opacity: 0, duration: 0.14, ease: "power1.in" }, 1.28);
      var cw = $$("#f03-conseil .fx-w");
      ft(cw[0], { y: 90, opacity: 0, filter: "blur(12px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, early(1.12));
      ft(cw[1], { y: 120, opacity: 0, filter: "blur(14px)", rotation: 2 }, { y: 0, opacity: 1, filter: "blur(0px)", rotation: 0, duration: 0.48, ease: "expo.out" }, early(1.24));
      ft($("f03-conseil"), { scale: 0.98 }, { scale: 1.04, duration: 0.95, ease: "none" }, 1.10);

      // caption « Votre métier, c’est » word by word (stops at c’est: no double with the kinetic)
      $$("#f03-cap1 .w").forEach(function (w, i) { FX.cue(tl, w, early([0.09, 0.39, 0.81][i]), { y: 18, d: 0.12 }); });

      /* ================= SCENE 2 (2.02 – 2.80) : pas la saisie ================= */
      tl.set($("f03-s1"), { opacity: 0 }, 2.02);
      tl.set($("f03-s2"), { opacity: 1 }, 2.02);
      FX.flash(tl, $("f03-flash"), 2.02, { peak: 0.9, d: 0.1 });
      // « PAS LA » types
      var ch = $$("#f03-pasla .f03-ch");
      [2.00, 2.03, 2.06, 2.09, 2.14, 2.17].forEach(function (t, i) { tl.set(ch[i], { opacity: 1 }, t); });
      ft($("f03-pasla"), { y: 10 }, { y: 0, duration: 0.2, ease: "expo.out" }, 2.02);
      // 2.25 SAISIE slam + chroma + shake + punch x1.1
      var chroma = FX.chroma($("f03-schroma"));
      // copies behind the ink: only the fringes show, the word stays black
      $("f03-schroma").insertBefore(chroma.b, $("f03-schroma").firstChild);
      $("f03-schroma").insertBefore(chroma.r, $("f03-schroma").firstChild);
      FX.slam(tl, $("f03-sword"), early(2.25), { chroma: chroma, from: 1.7, blur: 20, d: 0.12, rot: -3 });
      FX.shake(tl, $("f03-shake2"), 2.25, { amp: 16, d: 0.3, n: 7, seed: 3 });
      tl.set($("f03-cam2"), { scale: 1 }, 2.02);
      FX.punch(tl, $("f03-cam2"), 2.25, { s: 1.1, d: 0.16, drift: 0.02, hold: 0.39 });
      ft($("f03-pasla"), { opacity: 1 }, { opacity: 0.85, duration: 0.2, ease: "none" }, 2.25);
      // 2.45 the black bar strikes the word left to right in 0.12 s
      ft($("f03-bar"), { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out" }, 2.45);
      FX.shake(tl, $("f03-cam2"), 2.53, { amp: 7, d: 0.16, n: 4, seed: 11 });

      /* ================= SCENE 3a (2.80 – 4.66) : split notebook | CRM ================= */
      tl.set($("f03-s2"), { opacity: 0 }, 2.80);
      tl.set($("f03-s3a"), { opacity: 1 }, 2.80);
      FX.flash(tl, $("f03-flash"), 2.80, { peak: 0.55, d: 0.08 });
      ft($("f03-lwrap"), { x: -90, rotationY: 16, filter: "blur(10px)" }, { x: 0, rotationY: 8, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 2.80);
      ft($("f03-rwrap"), { x: 90, rotationY: -16, filter: "blur(10px)" }, { x: 0, rotationY: -8, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 2.80);
      tl.to($("f03-lwrap"), { rotationY: 4, duration: 1.56, ease: "none" }, 3.10);
      tl.to($("f03-rwrap"), { rotationY: -4, duration: 1.56, ease: "none" }, 3.10);
      ft($("f03-cam3"), { scale: 1 }, { scale: 1.04, duration: 1.86, ease: "none" }, 2.80);

      // caption « Pourtant, vous [retapez] vos notes, »
      $$("#f03-cap3 .w").forEach(function (w, i) { FX.cue(tl, w, early([2.87, 3.38, 3.60, 3.99, 4.16][i]), { y: 18, d: 0.12 }); });
      FX.key(tl, $("f03-key3"), early(3.60));
      ft($("f03-cap3"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.06, ease: "power2.in" }, 4.60);

      // the caret retypes: Lebrun 3.60 (0.05 s/letter), 10/10/1978 3.95, Paris 4.20
      function typeField(n, t0, per, tOff) {
        var span = $("f03-t" + n), txt = span.textContent;
        span.textContent = "";
        var cs = txt.split("").map(function (c) { var s = document.createElement("span"); s.className = "f03-c"; s.textContent = c; span.appendChild(s); return s; });
        tl.set($("f03-on" + n), { opacity: 1 }, t0 - 0.03);
        tl.set($("f03-car" + n), { opacity: 1 }, t0 - 0.03);
        cs.forEach(function (s, i) { tl.set(s, { display: "inline" }, t0 + i * per); });
        if (tOff) tl.set([$("f03-on" + n), $("f03-car" + n)], { opacity: 0 }, tOff);
        ft($("f03-mk" + n), { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "power3.out" }, t0 - 0.02);
      }
      typeField(1, 3.60, 0.05, 3.93);
      typeField(2, 3.95, 0.024, 4.18);
      typeField(3, 4.20, 0.05, 0);
      [[4.47, 0], [4.57, 1]].forEach(function (s) { tl.set($("f03-car3"), { opacity: s[1] }, s[0]); });

      /* ================= SCENE 3b (4.66 – 5.80) : fiche par fiche, the wall ================= */
      tl.set($("f03-s3a"), { opacity: 0 }, 4.66);
      tl.set($("f03-s3b"), { opacity: 1 }, 4.66);
      FX.flash(tl, $("f03-flash"), 4.66, { peak: 0.4, d: 0.07 });

      // build 16 identical forms, center 4 first
      var wall = $("f03-wall");
      var formHTML = '<div class="f03-head"><span class="fx-label">MON CRM</span><span class="f03-dot">·</span><span>Nouveau prospect</span></div>' +
        '<div class="f03-wr"><span class="fx-label">Nom</span><b>Lebrun</b></div>' +
        '<div class="f03-wr"><span class="fx-label">Date de naissance</span><b>10/10/1978</b></div>' +
        '<div class="f03-wr"><span class="fx-label">Ville</span><b>Paris</b></div>' +
        '<div class="f03-wr"><span class="fx-label">Besoin</span><b></b></div>';
      var SX = 680, SY = 410; // cell pitch (card 640x370 + gap 40)
      var cells = [];
      for (var r = 0; r < 4; r++) for (var c = 0; c < 4; c++) cells.push({ x: (c - 1.5) * SX, y: (r - 1.5) * SY, r: r, c: c });
      var inner = cells.filter(function (k) { return (k.r === 1 || k.r === 2) && (k.c === 1 || k.c === 2); });
      var outer = cells.filter(function (k) { return inner.indexOf(k) < 0; });
      // inner order: top-left, top-right, bottom-left, bottom-right
      var order = [inner[0], inner[1], inner[2], inner[3]].concat(outer);
      var cards = order.map(function (k, i) {
        var d = document.createElement("div");
        d.className = "fx-card f03-wc"; d.id = "f03-wc" + i; d.innerHTML = formHTML; wall.appendChild(d); return d;
      });
      // 4.66: the form alone, center
      ft(cards[0], { x: 0, y: 0, scale: 1.08, opacity: 1 }, { scale: 1, duration: 0.12, ease: "expo.out" }, 4.66);
      // 4.70: x2 (side by side, from the center)
      tl.set(cards[1], { opacity: 1 }, 4.70);
      ft(cards[0], { x: 0, y: 0 }, { x: -SX / 2, y: 0, duration: 0.1, ease: "expo.out" }, 4.70);
      ft(cards[1], { x: 0, y: 0, scale: 1 }, { x: SX / 2, y: 0, duration: 0.1, ease: "expo.out" }, 4.70);
      // 4.98: x4
      tl.set([cards[2], cards[3]], { opacity: 1 }, early(4.98));
      ft(cards[0], { y: 0 }, { y: -SY / 2, duration: 0.1, ease: "expo.out" }, early(4.98));
      ft(cards[1], { y: 0 }, { y: -SY / 2, duration: 0.1, ease: "expo.out" }, early(4.98));
      ft(cards[2], { x: -SX / 2, y: 0, scale: 1 }, { y: SY / 2, duration: 0.1, ease: "expo.out" }, early(4.98));
      ft(cards[3], { x: SX / 2, y: 0, scale: 1 }, { y: SY / 2, duration: 0.1, ease: "expo.out" }, early(4.98));
      // 5.17: x16, the outer ring bursts out of the center
      cards.slice(4).forEach(function (cd, i) {
        var k = order[i + 4], t = early(5.17) + (Math.abs(k.r - 1.5) + Math.abs(k.c - 1.5) - 2) * 0.012;
        tl.set(cd, { opacity: 1 }, t);
        ft(cd, { x: k.x * 0.25, y: k.y * 0.25, scale: 0.7, filter: "blur(6px)" }, { x: k.x, y: k.y, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out" }, t);
      });
      // camera recedes x1 -> x0.55 (power2.out), slight drift
      ft(wall, { scale: 1, rotation: 0 }, { scale: 0.55, rotation: -1.2, duration: DUR - 4.66, ease: "power2.out" }, 4.66);
      ft($("f03-glow2"), { scale: 0.6 }, { scale: 1.1, duration: DUR - 4.66, ease: "none" }, 4.66);

      // the outline band « FICHE PAR FICHE PAR FICHE » scrolls in front, words land on the voice
      tl.set($("f03-bandbg"), { opacity: 1 }, 4.66);
      ft($("f03-band"), { x: 0 }, { x: -220, duration: DUR - 4.66, ease: "none" }, 4.66);
      var bw = $$("#f03-band .fx-w");
      [4.66, 4.98, 5.17, 5.36, 5.52].forEach(function (t, i) {
        ft(bw[i], { y: 0, scale: 1.35, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out" }, i < 3 ? early(t) : t);
      });

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
