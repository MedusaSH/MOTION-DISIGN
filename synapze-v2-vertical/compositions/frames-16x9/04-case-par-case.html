        </div>
      </div></div><div class="f04-mvig"></div><div class="f04-mscrim"></div></div>

      <div class="fx-streak" id="f04-streak1"></div>
      <div class="fx-streak" id="f04-streak2"></div>

      <!-- caption: the voice, word by word -->
      <div class="fx-cap" id="f04-cap"><span class="w" data-cue="0.10">Vous</span> <span class="w" data-cue="0.31">remplissez</span> <span class="w" data-cue="0.84">le</span> <span class="w" data-cue="0.94">devoir</span> <span class="w" data-cue="1.26">de</span> <span class="w" data-cue="1.36">conseil,</span> <span class="fx-key" id="f04-key"><span class="w" data-cue="2.00">case</span> <span class="w" data-cue="2.27">par</span> <span class="w" data-cue="2.47">case.</span></span></div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
  (function () {
/* ===================== FX : début du kit JS à copier ===================== */
/* All helpers add seek-safe tweens to the frame's paused timeline `tl`. Times are frame-local seconds. */
const FX = {
  /* deterministic pseudo-random from an index (no random) */
  rnd: (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); },
  /* split text of el into .fx-w spans per word (call once at build) */
  words(el) { const t = el.textContent.trim().split(/\s+/); el.textContent = "";
    return t.map((w, i) => { const s = document.createElement("span"); s.className = "fx-w"; s.textContent = w;
      el.appendChild(s); if (i < t.length - 1) el.appendChild(document.createTextNode(" ")); return s; }); },
  /* chromatic copies inside a .fx-chroma wrapper: returns {r, b} */
  chroma(wrap) { const txt = wrap.textContent; const mk = (c) => { const s = document.createElement("span"); s.className = c; s.textContent = txt; s.setAttribute("aria-hidden", "true"); wrap.appendChild(s); return s; };
    return { r: mk("r"), b: mk("b") }; },
  /* SLAM: element arrives too big + blurred and lands hard (1-4 frames), chromatic split snaps back */
  slam(tl, el, t, { from = 1.6, blur = 18, d = 0.12, chroma = null, rot = 0 } = {}) {
    tl.fromTo(el, { scale: from, opacity: 0, filter: `blur(${blur}px)`, rotation: rot }, { scale: 1, opacity: 1, filter: "blur(0px)", rotation: 0, duration: d, ease: "expo.out", immediateRender: false }, t);
    if (chroma) { tl.fromTo(chroma.r, { x: -14, opacity: .9 }, { x: 0, opacity: 0, duration: .28, ease: "power3.out", immediateRender: false }, t);
                  tl.fromTo(chroma.b, { x: 14, opacity: .9 }, { x: 0, opacity: 0, duration: .28, ease: "power3.out", immediateRender: false }, t); }
  },
  /* RISE: words mask-up one by one (wrap each .fx-w parent with overflow hidden yourself if you want a hard mask) */
  rise(tl, words, t, { stagger = 0.06, d = 0.32, y = 60 } = {}) {
    words.forEach((w, i) => tl.fromTo(w, { y, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: d, ease: "expo.out", immediateRender: false }, t + i * stagger)); },
  /* cue a single word exactly on its voice time */
  cue(tl, w, t, { y = 30, d = 0.14 } = {}) { tl.fromTo(w, { y, opacity: 0, filter: "blur(6px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: d, ease: "expo.out", immediateRender: false }, t); },
  /* SHAKE: deterministic camera shake on an impact (finite keyframes) */
  shake(tl, el, t, { amp = 14, d = 0.32, n = 7, seed = 1 } = {}) {
    for (let i = 0; i < n; i++) { const k = 1 - i / n; tl.to(el, { x: (FX.rnd(seed + i) - .5) * 2 * amp * k, y: (FX.rnd(seed + i + 50) - .5) * 2 * amp * k, duration: d / n, ease: "none" }, t + i * d / n); }
    tl.to(el, { x: 0, y: 0, duration: d / n, ease: "power2.out" }, t + d); },
  /* FLASH: 1-2 frame white (or ember) flash on a cut */
  flash(tl, el, t, { peak = 0.85, d = 0.1 } = {}) { tl.fromTo(el, { opacity: peak }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t); },
  /* WHIP: blur-pan out of a shot (exit) */
  whipOut(tl, el, t, { x = -900, d = 0.16 } = {}) { tl.to(el, { x, filter: "blur(28px)", duration: d, ease: "power3.in" }, t); },
  whipIn(tl, el, t, { x = 900, d = 0.22 } = {}) { tl.fromTo(el, { x, filter: "blur(28px)", opacity: 1 }, { x: 0, filter: "blur(0px)", duration: d, ease: "expo.out", immediateRender: false }, t); },
  /* PUNCH: fast zoom-in on a target (camera), then slow drift */
  punch(tl, cam, t, { s = 1.35, x = 0, y = 0, d = 0.18, drift = 0.04, hold = 1 } = {}) {
    tl.to(cam, { scale: s, x, y, duration: d, ease: "expo.out" }, t);
    tl.to(cam, { scale: s * (1 + drift), duration: hold, ease: "none" }, t + d); },
  /* KEY BOX: the orange box of a caption keyword opens left to right */
  key(tl, el, t) { tl.fromTo(el, { "--k": 0 }, { "--k": 1, duration: .14, ease: "power3.out", immediateRender: false }, t); },
  /* SHIMMER: gradient sweep through .fx-k.hot text */
  shimmer(tl, el, t, { d = 1.2 } = {}) { tl.fromTo(el, { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: d, ease: "power2.inOut", immediateRender: false }, t); },
  /* ROLL: digits text sequence (discrete, seek-safe) e.g. ["19:00","20:12","21:30","22:47"] at times */
  roll(tl, el, values, times) { values.forEach((v, i) => tl.set(el, { textContent: v }, times[i])); },
};
/* ===================== FX : fin du kit JS à copier ===================== */

    var FID = "04-case-par-case", DUR = 3.0, F = 1 / 30;
    var root = document.querySelector('[data-composition-id="' + FID + '"]');
    var $ = function (id) { return root.querySelector("#" + id); };
    var tl = gsap.timeline({ paused: true });
    // fromTo helper: anything starting after t = 0 never renders its start state early
    function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

    /* ======================= Scene 1 (0.00 – 2.00) ======================= */
    var form = $("f04-form"), cam1 = $("f04-cam1");
    // 0.00 handoff_in: the form enters tilted (rotateX 14, rotateY 10), x1.2, blurred; lands in 0.25 s (pop 0.05)
    ft(form, { scale: 1.2, y: 60, filter: "blur(18px)", opacity: 0.9 },
             { scale: 1, y: 0, filter: "blur(0px)", opacity: 1, duration: 0.25, ease: "expo.out" }, 0);
    // camera drift: rotateY 10 -> 4, rotateX 14 -> 11 over the scene (linear, never stops)
    ft(form, { rotationX: 14, rotationY: 10 }, { rotationX: 11, rotationY: 4, duration: 2.0, ease: "none" }, 0);
    // push 4 %/s, then 1.50 the slow push towards the first box
    ft(cam1, { scale: 1, x: 0, y: 0 }, { scale: 1.06, x: 0, y: 0, duration: 1.5, ease: "none" }, 0);
    ft(cam1, { scale: 1.06, x: 0, y: 0 }, { scale: 1.3, x: 150, y: 70, duration: 0.5, ease: "sine.in" }, 1.5);
    // ember glows drift
    ft($("f04-glow"), { x: 0, y: 0, scale: 1 }, { x: -120, y: 30, scale: 1.08, duration: 2.0, ease: "none" }, 0);
    ft($("f04-glow2"), { x: 0, opacity: 0.35 }, { x: 60, opacity: 0.6, duration: 2.0, ease: "none" }, 0);

    // 0.40 the rows type themselves, one after another
    for (var k = 1; k <= 5; k++) {
      var t0 = 0.40 + (k - 1) * 0.09, lab = $("f04-l" + k), n = lab.textContent.length;
      ft($("f04-b" + k), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.2)" }, t0);
      ft(lab, { opacity: 1, clipPath: "inset(-20% 100% -20% 0%)" }, { opacity: 1, clipPath: "inset(-20% 0% -20% 0%)", duration: 0.24, ease: "steps(" + Math.min(n, 14) + ")" }, t0 + 0.02);
      ft($("f04-f" + k), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "expo.out" }, t0 + 0.12);
    }
    // a warm sheen glides over the paper (1.30 – 1.80, on « conseil »)
    ft($("f04-sheenbar"), { x: 0, rotation: 18 }, { x: 1700, rotation: 18, duration: 0.55, ease: "power2.inOut" }, 1.28);

    // 0.90 the mouse arrow arrives on a curve (0.4 s), then creeps onto the first box
    var cur1 = $("f04-cur1");
    ft(cur1, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 0.90);
    ft(cur1, { x: 1160 }, { x: 124, duration: 0.40, ease: "power3.out" }, 0.90);
    ft(cur1, { y: 720 }, { y: 250, duration: 0.40, ease: "power1.out" }, 0.90);
    ft(cur1, { rotation: -14 }, { rotation: 0, duration: 0.40, ease: "power2.out" }, 0.90);
    ft(cur1, { x: 124, y: 250 }, { x: 102, y: 232, duration: 0.6, ease: "sine.inOut" }, 1.40);

    /* ======================= Scene 2 (2.00 – 3.00): case · par · case ======================= */
    var CUTS = [2.00, 2.27, 2.47], ENDS = [2.27, 2.47, 3.00];
    var shots = [$("f04-m1"), $("f04-m2"), $("f04-m3")];
    // hard cuts (seek-safe sets)
    tl.set($("f04-s1"), { opacity: 1 }, 0);
    tl.set($("f04-s1"), { opacity: 0 }, CUTS[0]);
    shots.forEach(function (s, i) {
      tl.set(s, { opacity: 1 }, CUTS[i]);
      if (i < 2) tl.set(s, { opacity: 0 }, CUTS[i + 1]);
    });
    // cursor tip targets per macro (plane coordinates) = box centre, slightly low-right
    var TIP = [[1220, 915], [1382, 946], [1541, 972]];
    var OFF = [[60, 70], [-70, 80], [70, 60]];
    var BOOST = [1.08, 1.08, 1.08];
    shots.forEach(function (s, i) {
      var j = i + 1, t = CUTS[i], len = ENDS[i] - t;
      var camEl = $("f04-m" + j + "cam"), shk = $("f04-m" + j + "shk"), cur = $("f04-m" + j + "cur");
      var on = $("f04-m" + j + "on"), burst = $("f04-m" + j + "burst"), tick = $("f04-m" + j + "tk").querySelector("path");
      var boxes = [on.previousElementSibling, on].concat(Array.prototype.slice.call(s.querySelectorAll(".f04-tick")));
      // micro-zoom x1 -> x1.08 across the macro
      ft(camEl, { scale: 1 }, { scale: BOOST[i], duration: len, ease: "none" }, t);
      // the arrow: already there on the cut, last 2 frames of its approach, then the press (cursor-click)
      ft(cur, { x: TIP[i][0] + OFF[i][0], y: TIP[i][1] + OFF[i][1] }, { x: TIP[i][0], y: TIP[i][1], duration: 0.05, ease: "expo.out" }, t);
      ft(cur, { scale: 1 }, { scale: 0.86, duration: 0.05, ease: "power1.in" }, t + 0.02);
      ft(cur, { scale: 0.86 }, { scale: 1, duration: 0.25, ease: "back.out(2)" }, t + 0.07);
      // the box: linear press, spring release (press-release-spring, dramatic)
      ft(boxes, { scale: 1 }, { scale: 0.88, duration: 0.05, ease: "power1.in" }, t + 0.02);
      ft(boxes, { scale: 0.88 }, { scale: 1, duration: 0.45, ease: "back.out(2.4)" }, t + 0.07);
      // the orange tick is drawn in 0.06 s, the box turns orange
      ft(on, { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, t + 0.03);
      var L = 30; try { L = Math.ceil(tick.getTotalLength()) + 1; } catch (e) {}
      var ticks = [tick];
      if (j === 3) { ticks.push($("f04-m3tkr").querySelector("path"), $("f04-m3tkb").querySelector("path")); }

      ft(ticks, { strokeDasharray: L, strokeDashoffset: L }, { strokeDasharray: L, strokeDashoffset: 0, duration: 0.06, ease: "power2.out" }, t + 0.03);
      // burst glow behind the box on the release
      ft(burst, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.25, duration: 0.18, ease: "power2.out" }, t + 0.07);
      ft(burst, { opacity: 1 }, { opacity: 0.45, duration: Math.max(0.1, len - 0.25), ease: "power2.in" }, t + 0.25);
      // shake on the impact
      FX.shake(tl, shk, t + 0.03, { amp: j === 3 ? 18 : 14, d: Math.min(0.32, len - 0.06), n: 7, seed: 11 * j });
    });
    // macro 3: chromatic split on the tick
    ft($("f04-m3tkr"), { x: -22, y: 6, opacity: 0.9 }, { x: 0, y: 0, opacity: 0, duration: 0.3, ease: "power3.out" }, CUTS[2] + 0.03);
    ft($("f04-m3tkb"), { x: 22, y: -6, opacity: 0.9 }, { x: 0, y: 0, opacity: 0, duration: 0.3, ease: "power3.out" }, CUTS[2] + 0.03);
    // flashes on the cuts
    FX.flash(tl, $("f04-flashw"), CUTS[0], { peak: 0.8, d: 0.08 });
    FX.flash(tl, $("f04-flashe"), CUTS[1], { peak: 0.55, d: 0.08 });
    FX.flash(tl, $("f04-flashw"), CUTS[2], { peak: 0.9, d: 0.1 });
    // light streaks crossing on the cuts
    ft($("f04-streak1"), { x: 0, opacity: 0.9 }, { x: 2200, opacity: 0, duration: 0.16, ease: "power2.out" }, CUTS[0]);
    ft($("f04-streak2"), { x: 2400, opacity: 0.8 }, { x: -400, opacity: 0, duration: 0.14, ease: "power2.out" }, CUTS[1]);
    ft($("f04-streak3"), { x: 0, opacity: 0 }, { x: -1400, opacity: 0.9, duration: 0.2, ease: "power2.in" }, 2.80);
    // 2.80 motion blur: the macro is yanked to the left, smeared
    ft($("f04-m3cam"), { x: 0, skewX: 0 }, { x: -220, skewX: -7, duration: 0.2, ease: "power2.in" }, 2.80);
    // the smear: per-element blur (every blurred object stays under 1800 px wide)
    var smear = Array.prototype.slice.call(shots[2].querySelectorAll(".f04-mbox:not(.f04-far), .f04-mon, .f04-tick, .f04-mlab, .f04-mcur"));
    ft(smear, { filter: "blur(0px)" }, { filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 2.80);

    /* ======================= caption: word by word, the key box opens at 2.00 ======================= */
    Array.prototype.forEach.call($("f04-cap").querySelectorAll(".w"), function (w) {
      var c = parseFloat(w.getAttribute("data-cue"));
      FX.cue(tl, w, Math.max(0.001, c - F), { y: 26, d: 0.12 });
    });
    FX.key(tl, $("f04-key"), CUTS[0] - F);

    /* ======================= grain lives (every 2 frames) ======================= */
    for (var g = 0, gi = 0; g < DUR; g += 2 * F, gi++) {
      tl.set($("f04-grain"), { x: Math.round((FX.rnd(gi + 300) - 0.5) * 60), y: Math.round((FX.rnd(gi + 700) - 0.5) * 60) }, g);
    }

    tl.set({}, {}, DUR);
    window.__timelines = window.__timelines || {};
    window.__timelines[FID] = tl;
  })();
  </script>
