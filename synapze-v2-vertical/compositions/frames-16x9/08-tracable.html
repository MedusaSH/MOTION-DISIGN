  flash(tl, el, t, { peak = 0.85, d = 0.1 } = {}) { tl.fromTo(el, { opacity: peak }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t); },
  /* WHIP: blur-pan out of a shot (exit) */
  whipOut(tl, el, t, { x = -900, d = 0.16 } = {}) { tl.to(el, { x, filter: "blur(28px)", duration: d, ease: "power3.in" }, t); },
  whipIn(tl, el, t, { x = 900, d = 0.22 } = {}) { tl.fromTo(el, { x, filter: "blur(28px)", opacity: 1 }, { x: 0, filter: "blur(0px)", duration: d, ease: "expo.out", immediateRender: false }, t); },
  /* PUNCH: fast zoom-in on a target (camera), then slow drift */
  punch(tl, cam, t, { s = 1.35, x = 0, y = 0, d = 0.18, drift = 0.04, hold = 1 } = {}) {
    tl.to(cam, { scale: s, x, y, duration: d, ease: "expo.out" }, t);
    tl.to(cam, { scale: s * (1 + drift), duration: hold, ease: "none" }, t + d); },
  /* KEY BOX: the orange box of a caption keyword opens left to right */
  key(tl, el, t) { tl.fromTo(el, { "--k": 0 }, { "--k": 1, duration: .14, ease: "power3.out", immediateRender: false }, t); },
  /* SHIMMER: gradient sweep through .fx-k.hot text */
  shimmer(tl, el, t, { d = 1.2 } = {}) { tl.fromTo(el, { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: d, ease: "power2.inOut", immediateRender: false }, t); },
  /* ROLL: digits text sequence (discrete, seek-safe) e.g. ["19:00","20:12","21:30","22:47"] at times */

};
/* ===================== FX : fin du kit JS à copier ===================== */

    const FID = "08-tracable", DUR = 2.95;
    const root = document.querySelector('[data-composition-id="' + FID + '"]');
    const $ = (id) => root.querySelector("#" + id);
    const tl = gsap.timeline({ paused: true });

    const tilt = $("f08-tilt"), doc = $("f08-doc"), punch = $("f08-punch"), shake = $("f08-shake"), whip = $("f08-whip");

    /* ---------- 0.00 → 0.25 : the form enters ×1.2, blurred, tilted, and lands (handoff_in) ---------- */
    tl.fromTo(tilt, { scale: 1.2, rotationY: 20, rotationX: 9, z: 0, filter: "blur(18px)" },
      { scale: 1, rotationY: 12, rotationX: 5, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, 0);
    // living drift before the cascade (never frozen)
    tl.fromTo(tilt, { rotationY: 12, rotationX: 5 }, { rotationY: 10.5, rotationX: 4, duration: 0.83, ease: "none", immediateRender: false }, 0.25);
    // CAMERA : rotateY → 0° during the cascade
    tl.fromTo(tilt, { rotationY: 10.5, rotationX: 4 }, { rotationY: 0, rotationX: 0, duration: 0.62, ease: "power2.inOut", immediateRender: false }, 1.08);
    // slow push under everything (2 %/s), then the punch on the stamp
    tl.fromTo(punch, { scale: 1 }, { scale: 1.04, duration: 2.17, ease: "none" }, 0);
    tl.fromTo($("f08-glow"), { x: -40, y: 10, scale: 0.92 }, { x: 40, y: -20, scale: 1.05, duration: DUR, ease: "none" }, 0);

    /* ---------- 0.30 → 1.08 : the machine reads the file (working state) ---------- */
    const dot = $("f08-dot");
    [0.30, 0.56, 0.82].forEach((t) => {
      tl.fromTo(dot, { scale: 1, boxShadow: "0 0 0 5px rgba(242,78,30,.16)" }, { scale: 1.45, boxShadow: "0 0 0 12px rgba(242,78,30,0)", duration: 0.13, ease: "power2.out", immediateRender: false }, t);
      tl.to(dot, { scale: 1, duration: 0.13, ease: "power2.in" }, t + 0.13);
    });
    tl.fromTo($("f08-auto"), { opacity: 0.35 }, { opacity: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, 0.30);
    const scan = $("f08-scan");
    tl.fromTo(scan, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none", immediateRender: false }, 0.55);
    tl.fromTo(scan, { y: 0 }, { y: 320, duration: 0.5, ease: "power1.inOut", immediateRender: false }, 0.55);
    tl.to(scan, { opacity: 0, duration: 0.08, ease: "none" }, 1.03);

    /* ---------- 1.08 : cascade, the five boxes tick themselves (0.1 s apart) ---------- */
    const rows = root.querySelectorAll(".f08-row");
    rows.forEach((r, i) => {
      const t = 1.08 + i * 0.1;
      const fill = r.querySelector(".f08-fill"), ck = r.querySelector(".f08-ck path"), box = r.querySelector(".f08-box");
      const L = ck.getTotalLength();
      ck.style.strokeDasharray = L; ck.style.strokeDashoffset = L;
      tl.fromTo(fill, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(2.6)", immediateRender: false }, t);
      tl.fromTo(ck, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.09, ease: "power2.out", immediateRender: false }, t + 0.03);
      tl.fromTo(box, { scale: 1 }, { scale: 1.18, duration: 0.05, ease: "power2.out", immediateRender: false }, t);
      tl.to(box, { scale: 1, duration: 0.16, ease: "back.out(3)" }, t + 0.05);
      tl.fromTo(r.querySelector(".f08-lbl"), { opacity: 0.5 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, t);
      tl.fromTo(r.querySelector(".f08-hl"), { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.2, ease: "expo.out", immediateRender: false }, t);
      tl.fromTo(r.querySelector(".f08-ia"), { opacity: 0, scale: 0.4, x: -18 }, { opacity: 1, scale: 1, x: 0, duration: 0.2, ease: "back.out(2.2)", immediateRender: false }, t + 0.04);
      // six orange sparks, deterministic directions
      const spk = r.querySelector(".f08-spk");
      for (let k = 0; k < 6; k++) {
        const s = document.createElement("i"); s.className = "f08-sp"; spk.appendChild(s);
        const a = (k / 6) * Math.PI * 2 + (FX.rnd(i * 7 + k) - 0.5) * 0.7 - 0.4;
        const d1 = 26, d2 = 58 + FX.rnd(i * 13 + k + 40) * 34;
        const deg = a * 180 / Math.PI;
        gsap.set(s, { rotation: deg });
        tl.fromTo(s, { x: Math.cos(a) * d1, y: Math.sin(a) * d1, opacity: 1, scaleX: 1.4 },
          { x: Math.cos(a) * d2, y: Math.sin(a) * d2, opacity: 0, scaleX: 0.4, duration: 0.34, ease: "power3.out", immediateRender: false }, t + 0.02);
      }
    });

    /* ---------- 1.10 : completeness ring fills 0 → full (0.6 s) ---------- */
    const arc = $("f08-arc"), AL = arc.getTotalLength();
    arc.style.strokeDasharray = AL; arc.style.strokeDashoffset = AL;
    tl.fromTo(arc, { strokeDashoffset: AL }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 1.10);
    const big = $("f08-bigck"), BL = big.getTotalLength();
    big.style.strokeDasharray = BL; big.style.strokeDashoffset = BL;
    tl.fromTo(big, { strokeDashoffset: BL }, { strokeDashoffset: 0, duration: 0.16, ease: "power3.out", immediateRender: false }, 1.70);
    tl.fromTo($("f08-ringwrap"), { scale: 1 }, { scale: 1.06, duration: 0.07, ease: "power2.out", immediateRender: false }, 1.70);
    tl.to($("f08-ringwrap"), { scale: 1, duration: 0.25, ease: "back.out(2.5)" }, 1.77);
    tl.fromTo($("f08-bloom"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, 1.70);
    tl.fromTo($("f08-glow"), { opacity: 0.55 }, { opacity: 0.85, duration: 0.4, ease: "power2.out", immediateRender: false }, 1.70);

    /* ---------- 2.10 : the stamp slams from the camera, contact 2.17 ---------- */
    const stamp = $("f08-stamp"), ch = FX.chroma($("f08-stxt"));
    tl.fromTo(stamp, { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none", immediateRender: false }, 2.10);
    tl.fromTo(stamp, { scale: 3.4, rotation: -4, z: 0, filter: "blur(18px)" }, { scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.07, ease: "power2.in", immediateRender: false }, 2.10);
    tl.to(stamp, { scale: 0.96, duration: 0.03, ease: "power2.out" }, 2.17);
    tl.to(stamp, { scale: 1, duration: 0.14, ease: "back.out(3)" }, 2.20);
    tl.fromTo(ch.r, { x: -14, opacity: .9 }, { x: 0, opacity: 0, duration: .28, ease: "power3.out", immediateRender: false }, 2.17);
    tl.fromTo(ch.b, { x: 14, opacity: .9 }, { x: 0, opacity: 0, duration: .28, ease: "power3.out", immediateRender: false }, 2.17);
    tl.fromTo($("f08-shock"), { opacity: 1, scale: 0.4 }, { opacity: 0, scale: 1.05, duration: 0.32, ease: "power3.out", immediateRender: false }, 2.17);
    tl.fromTo($("f08-glow2"), { opacity: 0, scale: 0.6 }, { opacity: 0.9, scale: 1, duration: 0.12, ease: "expo.out", immediateRender: false }, 2.17);
    tl.to($("f08-glow2"), { opacity: 0.35, duration: 0.4, ease: "power2.out" }, 2.29);
    FX.flash(tl, $("f08-flash"), 2.17, { peak: 0.55, d: 0.1 });
    FX.shake(tl, shake, 2.17, { amp: 14, d: 0.32, n: 7, seed: 8 });
    // CAMERA : punch ×1.08 at 2.17 (on top of the 4 % push), then drift
    tl.to(punch, { scale: 1.04 * 1.08, duration: 0.14, ease: "expo.out" }, 2.17);
    tl.to(punch, { scale: 1.04 * 1.08 * 1.015, duration: 0.64, ease: "none" }, 2.31);

    /* ---------- 2.65 : whip-out to the right (handoff_out : blur 28 px at 2.95) ---------- */
    tl.fromTo(whip, { x: 0 }, { x: 760, duration: 0.30, ease: "power2.in", immediateRender: false }, 2.65);
    tl.fromTo(doc, { filter: "blur(0px)" }, { filter: "blur(28px)", duration: 0.30, ease: "power2.in", immediateRender: false }, 2.65);

    /* ---------- caption : word by word on the voice, one orange box on « tout seul, » ---------- */
    const CUES = [0.06, 0.17, 0.49, 0.60, 0.97, 1.08, 1.46, 1.67, 2.17];
    root.querySelectorAll("#f08-cap .w").forEach((w, i) => FX.cue(tl, w, Math.max(0.001, CUES[i] - 1 / 30), { y: 22, d: 0.12 }));
    FX.key(tl, $("f08-key"), 1.46 - 1 / 30);

    tl.set({}, {}, DUR);
    window.__timelines = window.__timelines || {};
    window.__timelines[FID] = tl;
  })();
  </script>
