            tl.fromTo(lines[curLine], { x: prevX }, { x: restX(curLine), duration: .16, ease: "power3.out", immediateRender: false }, t);

        var order = [];

            tl.fromTo(block, { y: BY[eLine] }, { y: BY[Le], duration: .12, ease: "power2.out", immediateRender: false }, te);
