      ft($("f09-a-b2"), { filter: "drop-shadow(0px 0px 2px rgba(242,78,30,0.9))" }, { filter: "drop-shadow(0px 0px 14px rgba(242,78,30,0.55))", duration: 0.5, ease: "power2.out" }, 1.40);
      // 1.46 punch on the answer (inside the screen: the phone never leaves the safe zone) + notification ring + glow pulse
      FX.punch(tl, $("f09-chat"), 1.46, { s: 1.08, d: 0.18, drift: 0.025, hold: CUT - 1.64 });
      ft($("f09-a-ring"), { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.12, duration: 0.42, ease: "power2.out" }, 1.46);
      ft($("f09-glow1"), { opacity: 1 }, { opacity: 0.7, duration: 0.6, ease: "power2.out" }, 1.46);
      // 1.72 read receipts turn blue
      ft($("f09-a-kg"), { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none" }, 1.72);
      // 2.05 a glare sweeps across the glass
      ft($("f09-glare1"), { x: 0, opacity: 1 }, { x: 760, opacity: 1, duration: 0.5, ease: "power2.inOut" }, 2.05);

      /* ======================= SCENE 2 (2.57 → 3.30) ======================= */
      // hard cut on « jour »
      tl.set($("f09-s1"), { opacity: 0 }, CUT);
      tl.set($("f09-s2"), { opacity: 1 }, CUT);
      tl.set($("f09-capA"), { opacity: 0 }, CUT);
      tl.set($("f09-capB"), { opacity: 1 }, CUT);
      FX.flash(tl, $("f09-flash"), CUT, { peak: 0.5, d: 0.08 });
      // the orange seam opens from the centre
      ft($("f09-seam"), { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "expo.out" }, CUT);
      // camera pull -2 %/s
      ft($("f09-cam2"), { scale: 1.0 }, { scale: 0.985, duration: DUR - CUT, ease: "none" }, CUT);
      // phones arrive from opposite wings (day from above, night from below), mirrored book-open tilt
      ft($("f09-pwL"), { y: -120, rotationX: -20, rotationY: 26, scale: 0.94 }, { y: 0, rotationX: -6, rotationY: 14, scale: 1, duration: 0.34, ease: "expo.out" }, CUT);
      ft($("f09-pwR"), { y: 120, rotationX: 20, rotationY: -26, scale: 0.94 }, { y: 0, rotationX: 6, rotationY: -14, scale: 1, duration: 0.34, ease: "expo.out" }, CUT + 0.04);
      ft($("f09-sun"), { x: 0, y: 0, scale: 0.9 }, { x: -30, y: 14, scale: 1.0, duration: DUR - CUT, ease: "none" }, CUT);
      ft($("f09-moon"), { x: 0 }, { x: 30, duration: DUR - CUT, ease: "none" }, CUT);
      // JOUR slams on the cut
      FX.slam(tl, $("f09-jour"), CUT, { chroma: FX.chroma($("f09-jourc")), from: 1.5 });
      // clocks: day stays 21:14, night rolls to 03:12 (vertical spring ticker, nested step wrappers = additive springs)
      ft($("f09-clkL"), { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.16, ease: "expo.out" }, CUT + 0.02);
      ft($("f09-clkR"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.16, ease: "expo.out" }, CUT + 0.02);
      var cols = root.querySelectorAll("#f09-clkR .f09-s1w");
      Array.prototype.forEach.call(cols, function (c, k) {
        var t0 = CUT + 0.05 + k * 0.035;
        ft(c, { y: 0 }, { y: -72, duration: 0.3, ease: "back.out(2)" }, t0);
        ft(c.firstElementChild, { y: 0 }, { y: -72, duration: 0.3, ease: "back.out(2.4)" }, t0 + 0.14);
      });
      // night thread: Camille's answer at 03:12, dots, then the instant reply
      ft($("f09-b-b3"), { opacity: 0, scale: 0.85, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.18, ease: "expo.out" }, CUT + 0.06);
      var ty2 = $("f09-b-ty");
      ft(ty2, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.1, ease: "back.out(2)" }, 2.72);
      Array.prototype.forEach.call(ty2.querySelectorAll("i"), function (d, k) {
        var t0 = 2.76 + k * 0.05;
        ft(d, { y: 0 }, { y: -5, duration: 0.07, ease: "power2.out" }, t0);
        ft(d, { y: -5 }, { y: 0, duration: 0.07, ease: "power2.in" }, t0 + 0.07);
      });
      tl.set(ty2, { opacity: 0 }, 2.95);
      // NUIT slams with shake
      FX.slam(tl, $("f09-nuit"), 2.89, { chroma: FX.chroma($("f09-nuitc")), from: 1.6 });
      FX.shake(tl, $("f09-shk"), 2.89, { amp: 12, d: 0.28, n: 7, seed: 9 });
      // 2.95 the reply pops
      ft($("f09-b-b4"), { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2.2)" }, 2.95);
      ft($("f09-b-ring"), { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.12, duration: 0.3, ease: "power2.out" }, 2.95);

      /* ======================= captions (word by word, on the cue) ======================= */
      var cues = [0.09, 0.25, 0.72, 0.99, 1.46, 1.78, 1.83, 1.99, 2.57, 2.78, 2.89];
      ["f09-capA", "f09-capB"].forEach(function (id) {
        var ws = $(id).querySelectorAll(".w");
        Array.prototype.forEach.call(ws, function (w, k) { FX.cue(tl, w, Math.max(0.001, cues[k] - F), { y: 24, d: 0.12 }); });
      });
      FX.key(tl, $("f09-keyA"), CUT - F);
      FX.key(tl, $("f09-keyB"), CUT - F);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
    </script>
